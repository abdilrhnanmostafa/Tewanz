            window.saveRoomSettings = async function(roomId) {
                const name = document.getElementById('roomNameInput').value.trim();
                const description = document.getElementById('roomDescInput').value.trim();
                let bg_url = null;

                if (state.roomCoverFile) {
                    try {
                        const file = state.roomCoverFile;
                        const fileName =
                            `room_${roomId}_${Date.now()}.${file.name.split('.').pop()}`;
                        const { data, error: uploadError } = await supabase.storage
                            .from('room_covers')
                            .upload(fileName, file);
                        if (uploadError) {
                            console.warn('Upload failed, using base64 fallback:', uploadError);
                            bg_url = state.roomCoverData;
                            showToast('⚠️ تم حفظ الصورة بتنسيق base64 (قد تكون كبيرة)', '');
                        } else {
                            const { data: urlData } = supabase.storage
                                .from('room_covers')
                                .getPublicUrl(fileName);
                            bg_url = urlData.publicUrl;
                        }
                    } catch (e) {
                        console.error('Error uploading room cover:', e);
                        bg_url = state.roomCoverData;
                        showToast('⚠️ تم حفظ الصورة بتنسيق base64', '');
                    }
                }

                const updateData = { name, description };
                if (bg_url) updateData.bg_url = bg_url;

                const { error } = await supabase
                    .from('rooms')
                    .update(updateData)
                    .eq('id', roomId);
                if (error) { showToast('خطأ في حفظ الإعدادات: ' + error.message, 'error'); return; }

                const room = state.rooms.find(r => r.id == roomId);
                if (room) {
                    room.name = name;
                    room.description = description;
                    if (bg_url) room.bg_url = bg_url;
                }

                showToast('✅ تم حفظ إعدادات الغرفة', 'success');
                document.getElementById('settingsModal').classList.remove('active');
                updateNavVisibility();
                renderRooms();
                if (state.currentRoomId == roomId) {
                    openRoomDetailPage(roomId);
                }
                state.roomCoverData = null;
                state.roomCoverFile = null;
                document.getElementById('roomCoverInput').value = '';
            };

            document.getElementById('settingsModalClose').addEventListener('click', function() {
                document.getElementById('settingsModal').classList.remove('active');
                updateNavVisibility();
                state.roomCoverData = null;
                state.roomCoverFile = null;
                document.getElementById('roomCoverInput').value = '';
            });
            document.getElementById('settingsModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                    updateNavVisibility();
                    state.roomCoverData = null;
                    state.roomCoverFile = null;
                    document.getElementById('roomCoverInput').value = '';
                }
            });

            // ==========================================================
            // 17. MUSIC PLAYER (نفس الكود السابق)
            // ==========================================================
            function setupMusicControls() {
                const playBtn = document.getElementById('mpPlayBtn');
                const progressBar = document.getElementById('mpProgressBar');
                const progressFill = document.getElementById('mpProgressFill');
                const currentTimeEl = document.getElementById('mpCurrentTime');
                const durationEl = document.getElementById('mpDuration');
                const volBar = document.getElementById('mpVolBar');
                const volFill = document.getElementById('mpVolFill');
                const fileBtn = document.getElementById('mpFileBtn');
                const fileInput = document.getElementById('mpFileInput');

                volFill.style.width = (state.music.volume * 100) + '%';
                volBar.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    state.music.volume = x;
                    volFill.style.width = (x * 100) + '%';
                    if (audioElement) audioElement.volume = x;
                    saveState();
                });

                fileBtn.addEventListener('click', function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول أولاً', 'error'); return; }
                    fileInput.click();
                });
                fileInput.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('audio/')) { showToast('يرجى اختيار ملف صوتي', 'error'); return; }
                    const url = URL.createObjectURL(file);
                    const title = file.name.replace(/\.[^/.]+$/, '');
                    loadLocalTrack(url, title, 'من هاتفي');
                    this.value = '';
                });

                playBtn.addEventListener('click', function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول', 'error'); return; }
                    if (!audioElement || !audioElement.src) { showToast('يرجى اختيار أغنية أولاً', 'error');
                        return; }
                    if (audioElement.paused) {
                        audioElement.play().catch(() => { showToast('حدث خطأ في التشغيل', 'error'); });
                        state.music.playing = true;
                        this.innerHTML = '<i class="fas fa-pause"></i>';
                        startMusicProgress();
                        showToast('🎵 تشغيل الموسيقى', 'success');
                    } else {
                        audioElement.pause();
                        state.music.playing = false;
                        this.innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(musicInterval);
                        musicInterval = null;
                    }
                    saveState();
                });

                progressBar.addEventListener('click', function(e) {
                    if (!audioElement || !audioElement.duration) return;
                    const rect = this.getBoundingClientRect();
                    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    audioElement.currentTime = x * audioElement.duration;
                });

                document.getElementById('mpPrevBtn').addEventListener('click', function() {
                    if (state.music.isLocal && audioElement && audioElement.src) {
                        audioElement.currentTime = 0;
                    } else {
                        showToast('لا توجد أغنية سابقة', '');
                    }
                });
                document.getElementById('mpNextBtn').addEventListener('click', function() {
                    fileInput.click();
                });

                if (audioElement) {
                    audioElement.addEventListener('loadedmetadata', function() {
                        const dur = this.duration;
                        if (dur && isFinite(dur)) durationEl.textContent = formatTime(dur);
                    });
                    audioElement.addEventListener('timeupdate', function() {
                        if (this.duration && isFinite(this.duration)) {
                            const pct = (this.currentTime / this.duration) * 100;
                            progressFill.style.width = pct + '%';
                            currentTimeEl.textContent = formatTime(this.currentTime);
                            state.music.progress = this.currentTime / this.duration;
                        }
                    });
                    audioElement.addEventListener('ended', function() {
                        state.music.playing = false;
                        document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(musicInterval);
                        musicInterval = null;
                        progressFill.style.width = '0%';
                        currentTimeEl.textContent = '00:00';
                        saveState();
                        showToast('🎵 انتهت الأغنية', '');
                    });
                }
                if (state.music.isLocal && state.music.currentTrack) {
                    const track = state.music.currentTrack;
                    if (track.url) {
                        loadLocalTrack(track.url, track.title || 'أغنية محلية', track.artist || 'من هاتفي');
                        if (state.music.playing && audioElement) {
                            audioElement.play().catch(() => {});
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            startMusicProgress();
                        }
                    }
                }
            }

            function loadLocalTrack(url, title, artist) {
                if (audioElement) { audioElement.pause();
                    audioElement.src = ''; }
                audioElement = new Audio(url);
                audioElement.volume = state.music.volume || 0.7;
                document.getElementById('mpTrackTitle').textContent = title || 'أغنية محلية';
                document.getElementById('mpTrackArtist').textContent = artist || 'من هاتفي';
                document.getElementById('mpDuration').textContent = 'جاري التحميل...';
                document.getElementById('mpProgressFill').style.width = '0%';
                document.getElementById('mpCurrentTime').textContent = '00:00';
                document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                state.music.isLocal = true;
                state.music.currentTrack = { url, title, artist };
                state.music.playing = false;
                audioElement.addEventListener('loadedmetadata', function() {
                    const dur = this.duration;
                    if (dur && isFinite(dur)) document.getElementById('mpDuration').textContent = formatTime(dur);
                });
                audioElement.addEventListener('timeupdate', function() {
                    if (this.duration && isFinite(this.duration)) {
                        const pct = (this.currentTime / this.duration) * 100;
                        document.getElementById('mpProgressFill').style.width = pct + '%';
                        document.getElementById('mpCurrentTime').textContent = formatTime(this.currentTime);
                        state.music.progress = this.currentTime / this.duration;
                    }
                });
                audioElement.addEventListener('ended', function() {
                    state.music.playing = false;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                    clearInterval(musicInterval);
                    musicInterval = null;
                    document.getElementById('mpProgressFill').style.width = '0%';
                    document.getElementById('mpCurrentTime').textContent = '00:00';
                    saveState();
                    showToast('🎵 انتهت الأغنية', '');
                });
                audioElement.addEventListener('error', function() { showToast('حدث خطأ في تشغيل الملف', 'error'); });
                showToast(`🎵 تم تحميل: ${title}`, 'success');
                saveState();
                audioElement.play().then(() => {
                    state.music.playing = true;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-pause"></i>';
                    startMusicProgress();
                }).catch(() => {
                    state.music.playing = false;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                });
            }

            function startMusicProgress() {
                clearInterval(musicInterval);
                musicInterval = setInterval(() => {
                    if (!audioElement || audioElement.paused) return;
                    if (audioElement.duration && isFinite(audioElement.duration)) {
                        const pct = (audioElement.currentTime / audioElement.duration) * 100;
                        document.getElementById('mpProgressFill').style.width = pct + '%';
                        document.getElementById('mpCurrentTime').textContent = formatTime(audioElement.currentTime);
                        state.music.progress = audioElement.currentTime / audioElement.duration;
                        saveState();
                    }
                }, 200);
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec) || !isFinite(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            async function renderChatList() {

                }
                let html = '';

                    const user = state.users.find(u => u.id === otherId);
                    if (!user) continue;
                    const msgs = await fetchPrivateMessages(chat.id);
                    const last = msgs.length > 0 ? msgs[msgs.length - 1] : null;
                    let lastText = last ? (last.sender_id === state.currentUser.id ? 'أنت: ' : '') + last.content :
                        'ابدأ المحادثة';
                    const time = last ? new Date(last.created_at).toLocaleTimeString([], { hour: '2-digit',
                        minute: '2-digit' }) : '';
                    const unread = msgs.filter(m => m.sender_id !== state.currentUser.id && m.status !== 'read').length;
                    html += `
                        <div class="chat-item" data-id="${user.id}" data-chat="${chat.id}">
                            <div class="avatar" style="background-image:url('${user.avatar_url || 'https://i.pravatar.cc/400?img=' + (user.id % 10 + 1)}')"><span class="online-dot ${user.online_status ? '' : 'offline'}"></span></div>
                            <div class="info">
                                <div class="name">${renderVerifiedName(user.full_name || 'مستخدم', user)}</div>
                                <div class="last-msg">${lastText}</div>
                            </div>
                            <div class="meta"><div class="time">${time}</div>${unread > 0 ? `<div class="badge">${unread}</div>` : ''}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
                container.querySelectorAll('.chat-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        state.chatPartnerId = id;

            async function openChatDetail(partnerId) {
                const overlay = document.getElementById('chatDetailOverlay');
                const partner = state.users.find(u => u.id === partnerId);
                if (!partner) return;

                document.getElementById('cdName').innerHTML = renderVerifiedName(partner.full_name || 'مستخدم', partner);
                document.getElementById('cdAvatar').style.backgroundImage =
                    `url('${partner.avatar_url || 'https://i.pravatar.cc/150?img=' + (partner.id % 10 + 1)}')`;
                document.getElementById('cdStatus').textContent = partner.online_status ? 'متصل الآن' : 'غير متصل';
                document.getElementById('cdStatus').style.color = partner.online_status ? '#34D399' : '#4B5563';

                const chatId = await getOrCreatePrivateChat(state.currentUser.id, partnerId);
                if (!chatId) { showToast('فشل إنشاء المحادثة', 'error'); return; }
                const msgs = await fetchPrivateMessages(chatId);
                for (const msg of msgs) {
                    if (msg.sender_id !== state.currentUser.id && msg.status !== 'read') {
                        await updateMessageStatus(msg.id, 'read');
                    }
                }
                overlay.dataset.chatId = chatId;
                overlay.dataset.partnerId = partnerId;
                renderChatMessages(msgs, partner);
                overlay.classList.add('active');
                updateNavVisibility();
                document.getElementById('cdInput').focus();
                updateBadges();
            }

            function renderChatMessages(msgs, partner) {
                const container = document.getElementById('cdMessages');
                const typingIndicator = document.getElementById('typingIndicator');
                container.innerHTML = '';
                container.appendChild(typingIndicator);
                if (msgs.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-chat';
                    empty.innerHTML =
                        `<i class="fas fa-comment-dots"></i><h4>لا توجد رسائل</h4><p>قل مرحباً لـ ${partner.full_name || 'المستخدم'}</p>`;
                    container.appendChild(empty);
                    return;
                }
                msgs.forEach(msg => {
                    const isMe = msg.sender_id === state.currentUser.id;
                    const sender = isMe ? state.currentUser : partner;
                    const wrapper = document.createElement('div');
                    wrapper.className = `msg-wrapper ${isMe ? 'sent' : 'received'}`;
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.textContent = msg.content;
                    const meta = document.createElement('div');
                    meta.className = 'msg-meta';
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit',
                        minute: '2-digit' });
                    meta.appendChild(timeSpan);
                    if (isMe) {
                        const statusSpan = document.createElement('span');
                        statusSpan.className = 'status';
                        if (msg.status === 'sent') statusSpan.innerHTML = '<i class="fas fa-check"></i>';
                        else if (msg.status === 'delivered') statusSpan.innerHTML =
                            '<i class="fas fa-check-double" style="color:var(--text-light);"></i>';
                        else if (msg.status === 'read') statusSpan.innerHTML =
                            '<i class="fas fa-check-double" style="color:#34D399;"></i>';
                        meta.appendChild(statusSpan);
                    }
                    wrapper.appendChild(bubble);
                    wrapper.appendChild(meta);
                    container.appendChild(wrapper);
                });
                container.scrollTop = container.scrollHeight;
            }

            async function sendChatMessage() {
                const overlay = document.getElementById('chatDetailOverlay');
                const chatId = parseInt(overlay.dataset.chatId);
                const partnerId = overlay.dataset.partnerId;
                if (!chatId || !partnerId) return;
                if (state.currentUser.is_muted) {
                    showToast('🔇 تم كتم صوتك، لا يمكنك إرسال رسائل', 'error');
                    return;
                }
                const input = document.getElementById('cdInput');
                const text = input.value.trim();
                if (!text) return;
                const msg = await sendPrivateMessage(chatId, state.currentUser.id, text);
                if (!msg) { showToast('فشل إرسال الرسالة', 'error'); return; }
                input.value = '';
                const partner = state.users.find(u => u.id === partnerId);
                const msgs = await fetchPrivateMessages(chatId);
                renderChatMessages(msgs, partner);
                updateBadges();

                if (partner && partner.online_status) {
                    setTimeout(async () => {
                        const msgs2 = await fetchPrivateMessages(chatId);
                        if (msgs2.length > 0) {
                            const last = msgs2[msgs2.length - 1];
                            if (last.sender_id === state.currentUser.id && last.status === 'sent') {
                                await updateMessageStatus(last.id, 'delivered');
                                const updated = await fetchPrivateMessages(chatId);
                                renderChatMessages(updated, partner);
                            }
                        }
                    }, 1000);
                    setTimeout(async () => {
                        const msgs2 = await fetchPrivateMessages(chatId);
                        if (msgs2.length > 0) {
                            const last = msgs2[msgs2.length - 1];
                            if (last.sender_id === state.currentUser.id) {
                                await updateMessageStatus(last.id, 'read');
                                const updated = await fetchPrivateMessages(chatId);
                                renderChatMessages(updated, partner);
                                showTypingIndicator(true);
                                clearTimeout(replyTimeout);
                                replyTimeout = setTimeout(async () => {
                                    showTypingIndicator(false);
                                    const replies = ['رائع! 😊', 'أخبرني المزيد', 'أوافقك الرأي',
                                        'واو! حقاً؟', 'جميل!', '😂', 'نعم!', '👍', 'أحب ذلك!',
                                        'جدياً؟'
                                    ];
                                    const reply = replies[Math.floor(Math.random() * replies
                                    .length)];
                                    const newMsg = await sendPrivateMessage(chatId, partner.id,
                                        reply);
                                    if (newMsg) {
                                        const updated2 = await fetchPrivateMessages(chatId);
                                        renderChatMessages(updated2, partner);
                                        updateBadges();
                                    }
                                }, 1500 + Math.random() * 1500);
                            }
                        }

                        .eq('is_read', false);
                    if (!error) {
                        const notifBadge = document.getElementById('notifBadge');
                        if (count > 0) {
                            notifBadge.textContent = count > 9 ? '9+' : count;
                            notifBadge.style.display = 'block';
                        } else {
                            notifBadge.style.display = 'none';
                        }
                    }
                } catch (e) { /* ignore */ }
            }

            // ==========================================================
            // 23. WINDOW HELPERS
            // ==========================================================
            window._twinzChat = function(id) { state.chatPartnerId = id;
                navigateTo('chatDetail', id); };
            window._toggleFavorite = toggleFavorite;
            window._toggleFollow = toggleFollow;
            window._openRoomDetail = openRoomDetailPage;

            // ==========================================================
            // 24. INIT
            // ==========================================================
            async function init() {
                loadState();
                await loadAdminSettings();

                const { data: session } = await supabase.auth.getSession();
                if (session?.session?.user) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', session.session.user.id)
                        .maybeSingle();
                    if (profile) {
                        if (profile.is_banned) {
                            showToast(`🚫 حسابك محظور. السبب: ${profile.ban_reason || 'لا يوجد سبب'}`, 'error');
                        } else if (profile.is_kicked) {
                            showToast('🚪 تم طردك من التطبيق مؤقتاً.', 'error');
                        } else {
                            state.currentUser = profile;
                            state.isLoggedIn = true;
                            await loadUserFavorites();
                            await loadFollowData();
                        }
                    }
                }

                initScreens();

                state.users = await fetchProfiles();
                state.rooms = await fetchRooms();

                if (state.isLoggedIn && state.currentUser) {
                    navigateTo('mainScreen');
                    renderMainFeed();
                } else {
                    navigateTo('splash');
                }

                updateBadges();
                setInterval(updateBadges, 30000);

                console.log('🚀 توينز — الإصدار النهائي مع إصلاح الصوت باستخدام AudioContext');
                console.log('📦 State:', state);
            }

            document.addEventListener('DOMContentLoaded', init);
            window.__twinz = { state, navigateTo, showToast, renderRooms, renderMainFeed, saveState, supabase };

        })();
    </script>
</body>
</html>
