            // ==========================================================
            // 12. WebRTC VOICE CHAT
            // ==========================================================
            const RTC_CONFIG = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            async function startWebRTCSignaling(roomId) {
                // Get all occupants in the room except myself
                const room = state.rooms.find(r => r.id == roomId);
                if (!room) return;
                const occupants = room.occupants || [];
                const otherUsers = occupants.filter(uid => uid !== state.currentUser.id);

                // Subscribe to signaling channels for each peer
                for (const userId of otherUsers) {
                    if (userId === state.currentUser.id) continue;
                    const channelName = `room:${roomId}:signal:${state.currentUser.id}:${userId}`;
                    const channel = supabase.channel(channelName);
                    state.voice.channels[userId] = channel;

                    channel.on('broadcast', { event: 'signal' }, async (payload) => {
                        const data = payload.payload;
                        if (data.from === userId) {
                            await handleSignal(state.currentUser.id, userId, data);
                        }
                    });

                    await channel.subscribe();
                    console.log(`📡 Subscribed to signal channel for ${userId}`);
                }

                // If there are other users, initiate connections
                for (const userId of otherUsers) {
                    if (userId === state.currentUser.id) continue;
                    await createPeerConnection(state.currentUser.id, userId);
                }
            }

            async function createPeerConnection(myId, peerId) {
                if (webrtcPeers[peerId]) {
                    console.log(`Peer ${peerId} already exists`);
                    return;
                }

                const pc = new RTCPeerConnection(RTC_CONFIG);
                webrtcPeers[peerId] = pc;

                // Add local stream if we have one
                if (state.voice.stream) {
                    state.voice.stream.getTracks().forEach(track => {
                        pc.addTrack(track, state.voice.stream);
                    });
                }

                // Handle incoming tracks
                pc.ontrack = (event) => {
                    console.log(`🎵 Received track from ${peerId}`);
                    const audio = new Audio();
                    audio.srcObject = event.streams[0];
                    audio.autoplay = true;
                    audio.volume = 0.7;
                    // Store for later volume control
                    if (!state.voice.peerAudios) state.voice.peerAudios = {};
                    state.voice.peerAudios[peerId] = audio;
                    // Update seat mic status
                    const seatIdx = state.rooms.find(r => r.id == state.currentRoomId)?.occupants?.indexOf(peerId);
                    if (seatIdx !== undefined && seatIdx >= 0) {
                        const seatMic = document.getElementById(`seatMic_${seatIdx}`);
                        if (seatMic) {
                            seatMic.classList.add('speaking');
                            // Remove speaking after a while (we'll use level detection later)
                            setTimeout(() => {
                                seatMic.classList.remove('speaking');
                            }, 2000);
                        }
                    }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        sendSignal(peerId, { type: 'candidate', candidate: event.candidate });
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    console.log(`ICE state for ${peerId}: ${pc.iceConnectionState}`);
                    if (pc.iceConnectionState === 'connected') {
                        showToast(`🔊 متصل مع ${state.users.find(u => u.id === peerId)?.full_name || 'مستخدم'}`, 'success');
                    }
                };

                // Create offer if we are the initiator (based on ID order)
                if (myId < peerId) {
                    try {
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        sendSignal(peerId, { type: 'offer', sdp: offer });
                    } catch (err) {
                        console.error('Error creating offer:', err);
                    }
                }
            }

            async function handleSignal(myId, fromId, data) {
                const pc = webrtcPeers[fromId];
                if (!pc) {
                    console.log(`No peer connection for ${fromId}, creating...`);
                    await createPeerConnection(myId, fromId);
                    // Retry after a short delay
                    setTimeout(() => handleSignal(myId, fromId, data), 500);
                    return;
                }

                try {
                    if (data.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        sendSignal(fromId, { type: 'answer', sdp: answer });
                    } else if (data.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    } else if (data.type === 'candidate') {
                        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                } catch (err) {
                    console.error('Signal handling error:', err);
                }
            }

            function sendSignal(targetId, data) {
                const channel = state.voice.channels[targetId];
                if (!channel) {
                    console.warn(`No channel for ${targetId}`);
                    return;
                }
                channel.send({
                    type: 'broadcast',
                    event: 'signal',
                    payload: { from: state.currentUser.id, ...data }
                });
            }

            // ==========================================================
            // 13. VOICE CONTROLS (enable/disable, mute)
            // ==========================================================
            async function setupVoiceControls() {
                const toggleBtn = document.getElementById('vcToggleBtn');
                const muteBtn = document.getElementById('vcMuteBtn');
                const vcDot = document.getElementById('vcDot');
                const vcLabel = document.getElementById('vcLabel');
                const vcLevelFill = document.getElementById('vcLevelFill');

                toggleBtn.onclick = async function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول', 'error'); return; }
                    if (state.voice.mySeatIndex === -1) {
                        showToast('يرجى الجلوس على مقعد أولاً', 'error');
                        return;
                    }
                    if (!state.voice.enabled) {
                        await toggleVoice(true);
                    } else {
                        await toggleVoice(false);
                    }
                };

                muteBtn.onclick = function() {
                    if (!state.voice.enabled) {
                        showToast('فعّل الميكروفون أولاً', 'error');
                        return;
                    }
                    state.voice.muted = !state.voice.muted;
                    // Mute/unmute local stream
                    if (state.voice.stream) {
                        state.voice.stream.getTracks().forEach(t => t.enabled = !state.voice.muted);
                    }
                    if (state.voice.muted) {
                        muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i> إلغاء الكتم';
                        muteBtn.classList.add('muted');
                        showToast('🔇 تم كتم الصوت', '');
                    } else {
                        muteBtn.innerHTML = '<i class="fas fa-volume-up"></i> كتم';
                        muteBtn.classList.remove('muted');
                        showToast('🔊 تم إلغاء الكتم', '');
                    }
                    updateVoiceUI();
                    saveState();
                };

                updateVoiceUI();
            }

            async function toggleVoice(enable) {
                if (enable) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                        });

                        state.voice.stream = stream;
                        state.voice.enabled = true;
                        state.voice.muted = false;

                        // Add stream to all existing peer connections
                        for (const peerId in webrtcPeers) {
                            const pc = webrtcPeers[peerId];
                            stream.getTracks().forEach(track => {
                                pc.addTrack(track, stream);
                            });
                            // Re-negotiate if needed
                            if (pc.signalingState === 'stable' && state.currentUser.id < peerId) {
                                const offer = await pc.createOffer();
                                await pc.setLocalDescription(offer);
                                sendSignal(peerId, { type: 'offer', sdp: offer });
                            }
                        }

                        // Start level monitoring
                        startVoiceLevelMonitoring();

                        showToast('🎤 الميكروفون نشط', 'success');
                        updateVoiceUI();
                        saveState();
                    } catch (err) {
                        showToast('❌ لا يمكن الوصول إلى الميكروفون: ' + err.message, 'error');
                        console.error('Mic error:', err);
                        state.voice.enabled = false;
                        updateVoiceUI();
                    }
                } else {
                    stopVoice();
                }
            }

            function stopVoice() {
                if (state.voice.stream) {
                    state.voice.stream.getTracks().forEach(t => t.stop());
                }
                state.voice.enabled = false;
                state.voice.muted = false;
                state.voice.stream = null;
                clearInterval(voiceLevelInterval);
                voiceLevelInterval = null;
                // Remove audio tracks from peers
                for (const peerId in webrtcPeers) {
                    const pc = webrtcPeers[peerId];
                    const senders = pc.getSenders();
                    senders.forEach(s => {
                        if (s.track && s.track.kind === 'audio') {
                            pc.removeTrack(s);
                        }
                    });
                }
                updateVoiceUI();
                saveState();
            }

            function startVoiceLevelMonitoring() {
                clearInterval(voiceLevelInterval);
                // Simple level simulation using analyser if available, else random
                voiceLevelInterval = setInterval(() => {
                    if (!state.voice.enabled || !state.voice.stream) {
                        document.getElementById('vcLevelFill').style.width = '0%';
                        return;
                    }
                    // If we have a real analyser (from previous version), use it; else simulate
                    // For demo, we simulate based on audio activity detection from stream
                    // Actually we can't easily detect level without analyser, so we simulate random
                    // But we'll use a simple approach: if stream is active, show some level
                    const isActive = state.voice.stream && state.voice.stream.active;
                    if (!isActive) {
                        document.getElementById('vcLevelFill').style.width = '0%';
                        return;
                    }
                    // Simulate level between 0.1 and 0.8 based on random to show activity
                    // In real app, you'd use AnalyserNode
                    const level = 0.1 + Math.random() * 0.7;
                    document.getElementById('vcLevelFill').style.width = (level * 100) + '%';
                    if (level > 0.3) {
                        document.getElementById('vcLevelFill').classList.add('speaking');
                        // Update seat mic
                        if (state.voice.mySeatIndex >= 0) {
                            const seatMic = document.getElementById(`seatMic_${state.voice.mySeatIndex}`);
                            if (seatMic) {
                                seatMic.classList.add('speaking');
                            }
                        }
                        // Update dot
                        document.getElementById('vcDot').classList.add('speaking');
                        document.getElementById('vcLabel').innerHTML = '🎤 <strong>تتحدث</strong>';
                    } else {
                        document.getElementById('vcLevelFill').classList.remove('speaking');
                        if (state.voice.mySeatIndex >= 0) {
                            const seatMic = document.getElementById(`seatMic_${state.voice.mySeatIndex}`);
                            if (seatMic) {
                                seatMic.classList.remove('speaking');
                            }
                        }
                        document.getElementById('vcDot').classList.remove('speaking');
                        document.getElementById('vcLabel').innerHTML = '🎙️ <strong>الميكروفون نشط</strong>';
                    }
                }, 200);
            }

            function updateVoiceUI() {
                const toggleBtn = document.getElementById('vcToggleBtn');
                const muteBtn = document.getElementById('vcMuteBtn');
                const vcDot = document.getElementById('vcDot');
                const vcLabel = document.getElementById('vcLabel');

                if (state.voice.enabled) {
                    toggleBtn.innerHTML = '<i class="fas fa-microphone"></i> إيقاف';
                    toggleBtn.classList.add('active');
                    vcDot.className = 'vc-dot active';
                    if (state.voice.muted) {
                        vcDot.classList.remove('speaking');
                        vcLabel.innerHTML = '🔇 <strong>مكتوم</strong> (لا يسمعك أحد)';
                    } else {
                        vcLabel.innerHTML = '🎙️ <strong>الميكروفون نشط</strong>';
                    }
                    muteBtn.style.display = 'flex';
                    if (state.voice.muted) {
                        muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i> إلغاء الكتم';
                        muteBtn.classList.add('muted');
                    } else {
                        muteBtn.innerHTML = '<i class="fas fa-volume-up"></i> كتم';
                        muteBtn.classList.remove('muted');
                    }
                } else {
                    toggleBtn.innerHTML = '<i class="fas fa-microphone-slash"></i> تفعيل';
                    toggleBtn.classList.remove('active');
                    vcDot.className = 'vc-dot';
                    vcLabel.innerHTML = '🔇 الميكروفون غير نشط';
                    muteBtn.style.display = 'none';
                    document.getElementById('vcLevelFill').style.width = '0%';
                    document.getElementById('vcLevelFill').classList.remove('speaking');
                }
            }

            // ==========================================================
            // 14. MUSIC PLAYER (unchanged)
            // ==========================================================
            function setupMusicControls() {
                const playBtn = document.getElementById('mpPlayBtn');
                const progressBar = document.getElementById('mpProgressBar');
                const progressFill = document.getElementById('mpProgressFill');
                const currentTimeEl = document.getElementById('mpCurrentTime');
                const durationEl = document.getElementById('mpDuration');
                const volBar = document.getElementById('mpVolBar');
                const volFill = document.getElementById('mpVolFill');
                const fileBtn = document.getElementById('mpFileBtn');
                const fileInput = document.getElementById('mpFileInput');

                volFill.style.width = (state.music.volume * 100) + '%';
                volBar.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    state.music.volume = x;
                    volFill.style.width = (x * 100) + '%';
                    if (audioElement) audioElement.volume = x;
                    saveState();
                });

                fileBtn.addEventListener('click', function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول أولاً', 'error'); return; }
                    fileInput.click();
                });
                fileInput.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('audio/')) { showToast('يرجى اختيار ملف صوتي', 'error'); return; }
                    const url = URL.createObjectURL(file);
                    const title = file.name.replace(/\.[^/.]+$/, '');
                    loadLocalTrack(url, title, 'من هاتفي');
                    this.value = '';
                });

                playBtn.addEventListener('click', function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول', 'error'); return; }
                    if (!audioElement || !audioElement.src) { showToast('يرجى اختيار أغنية أولاً', 'error');
                        return; }
                    if (audioElement.paused) {
                        audioElement.play().catch(() => { showToast('حدث خطأ في التشغيل', 'error'); });
                        state.music.playing = true;
                        this.innerHTML = '<i class="fas fa-pause"></i>';
                        startMusicProgress();
                        showToast('🎵 تشغيل الموسيقى', 'success');
                    } else {
                        audioElement.pause();
                        state.music.playing = false;
                        this.innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(musicInterval);
                        musicInterval = null;
                    }
                    saveState();
                });

                progressBar.addEventListener('click', function(e) {
                    if (!audioElement || !audioElement.duration) return;
                    const rect = this.getBoundingClientRect();
                    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    audioElement.currentTime = x * audioElement.duration;
                });

                document.getElementById('mpPrevBtn').addEventListener('click', function() {
                    if (state.music.isLocal && audioElement && audioElement.src) {
                        audioElement.currentTime = 0;
                    } else {
                        showToast('لا توجد أغنية سابقة', '');
                    }
                });
                document.getElementById('mpNextBtn').addEventListener('click', function() {
                    fileInput.click();
                });

                if (audioElement) {
                    audioElement.addEventListener('loadedmetadata', function() {
                        const dur = this.duration;
                        if (dur && isFinite(dur)) durationEl.textContent = formatTime(dur);
                    });
                    audioElement.addEventListener('timeupdate', function() {
                        if (this.duration && isFinite(this.duration)) {
                            const pct = (this.currentTime / this.duration) * 100;
                            progressFill.style.width = pct + '%';
                            currentTimeEl.textContent = formatTime(this.currentTime);
                            state.music.progress = this.currentTime / this.duration;
                        }
                    });
                    audioElement.addEventListener('ended', function() {
                        state.music.playing = false;
                        document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(musicInterval);
                        musicInterval = null;
                        progressFill.style.width = '0%';
                        currentTimeEl.textContent = '00:00';
                        saveState();
                        showToast('🎵 انتهت الأغنية', '');
                    });
                }
                if (state.music.isLocal && state.music.currentTrack) {
                    const track = state.music.currentTrack;
                    if (track.url) {
                        loadLocalTrack(track.url, track.title || 'أغنية محلية', track.artist || 'من هاتفي');
                        if (state.music.playing && audioElement) {
                            audioElement.play().catch(() => {});
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            startMusicProgress();
                        }
                    }
                }
            }

            function loadLocalTrack(url, title, artist) {
                if (audioElement) { audioElement.pause();
                    audioElement.src = ''; }
                audioElement = new Audio(url);
                audioElement.volume = state.music.volume || 0.7;
                document.getElementById('mpTrackTitle').textContent = title || 'أغنية محلية';
                document.getElementById('mpTrackArtist').textContent = artist || 'من هاتفي';
                document.getElementById('mpDuration').textContent = 'جاري التحميل...';
                document.getElementById('mpProgressFill').style.width = '0%';
                document.getElementById('mpCurrentTime').textContent = '00:00';
                document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                state.music.isLocal = true;
                state.music.currentTrack = { url, title, artist };
                state.music.playing = false;
                audioElement.addEventListener('loadedmetadata', function() {
                    const dur = this.duration;
                    if (dur && isFinite(dur)) document.getElementById('mpDuration').textContent = formatTime(dur);
                });
                audioElement.addEventListener('timeupdate', function() {
                    if (this.duration && isFinite(this.duration)) {
                        const pct = (this.currentTime / this.duration) * 100;
                        document.getElementById('mpProgressFill').style.width = pct + '%';
                        document.getElementById('mpCurrentTime').textContent = formatTime(this.currentTime);
                        state.music.progress = this.currentTime / this.duration;
                    }
                });
                audioElement.addEventListener('ended', function() {
                    state.music.playing = false;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                    clearInterval(musicInterval);
                    musicInterval = null;
                    document.getElementById('mpProgressFill').style.width = '0%';
                    document.getElementById('mpCurrentTime').textContent = '00:00';
                    saveState();
                    showToast('🎵 انتهت الأغنية', '');
                });
                audioElement.addEventListener('error', function() { showToast('حدث خطأ في تشغيل الملف', 'error'); });
                showToast(`🎵 تم تحميل: ${title}`, 'success');
                saveState();
                audioElement.play().then(() => {
                    state.music.playing = true;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-pause"></i>';
                    startMusicProgress();
                }).catch(() => {
                    state.music.playing = false;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                });
            }

            function startMusicProgress() {
                clearInterval(musicInterval);
                musicInterval = setInterval(() => {
                    if (!audioElement || audioElement.paused) return;
                    if (audioElement.duration && isFinite(audioElement.duration)) {
                        const pct = (audioElement.currentTime / audioElement.duration) * 100;
                        document.getElementById('mpProgressFill').style.width = pct + '%';
                        document.getElementById('mpCurrentTime').textContent = formatTime(audioElement.currentTime);
                        state.music.progress = audioElement.currentTime / audioElement.duration;
                        saveState();
                    }
                }, 200);
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec) || !isFinite(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            async function openChatDetail(partnerId) {
                const overlay = document.getElementById('chatDetailOverlay');

                document.getElementById('cdName').textContent = partner.full_name || 'مستخدم';

                document.getElementById('cdStatus').style.color = partner.online_status ? '#34D399' : '#4B5563';

                const chatId = await getOrCreatePrivateChat(state.currentUser.id, partnerId);
                if (!chatId) { showToast('فشل إنشاء المحادثة', 'error'); return; }
                const msgs = await fetchPrivateMessages(chatId);
                for (const msg of msgs) {
                    if (msg.sender_id !== state.currentUser.id && msg.status !== 'read') {
                        await updateMessageStatus(msg.id, 'read');
                    }
                }
                overlay.dataset.chatId = chatId;
                overlay.dataset.partnerId = partnerId;
                renderChatMessages(msgs, partner);
                overlay.classList.add('active');

            function renderChatMessages(msgs, partner) {
                const container = document.getElementById('cdMessages');
                const typingIndicator = document.getElementById('typingIndicator');
                container.innerHTML = '';
                container.appendChild(typingIndicator);
                if (msgs.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-chat';
                    empty.innerHTML =
                        `<i class="fas fa-comment-dots"></i><h4>لا توجد رسائل</h4><p>قل مرحباً لـ ${partner.full_name || 'المستخدم'}</p>`;
                    container.appendChild(empty);
                    return;
                }
                msgs.forEach(msg => {
                    const isMe = msg.sender_id === state.currentUser.id;
                    const wrapper = document.createElement('div');
                    wrapper.className = `msg-wrapper ${isMe ? 'sent' : 'received'}`;
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.textContent = msg.content;
                    const meta = document.createElement('div');
                    meta.className = 'msg-meta';
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit',
                        minute: '2-digit' });
                    meta.appendChild(timeSpan);
                    if (isMe) {
                        const statusSpan = document.createElement('span');
                        statusSpan.className = 'status';
                        if (msg.status === 'sent') statusSpan.innerHTML = '<i class="fas fa-check"></i>';
                        else if (msg.status === 'delivered') statusSpan.innerHTML =
                            '<i class="fas fa-check-double" style="color:var(--text-light);"></i>';
                        else if (msg.status === 'read') statusSpan.innerHTML =
                            '<i class="fas fa-check-double" style="color:#34D399;"></i>';
                        meta.appendChild(statusSpan);
                    }
                    wrapper.appendChild(bubble);
                    wrapper.appendChild(meta);
                    container.appendChild(wrapper);
                });
                container.scrollTop = container.scrollHeight;
            }

            async function sendChatMessage() {
                const overlay = document.getElementById('chatDetailOverlay');
                const chatId = parseInt(overlay.dataset.chatId);
                const partnerId = overlay.dataset.partnerId;
                if (!chatId || !partnerId) return;
                const input = document.getElementById('cdInput');
                const text = input.value.trim();
                if (!text) return;
                const msg = await sendPrivateMessage(chatId, state.currentUser.id, text);
                if (!msg) { showToast('فشل إرسال الرسالة', 'error'); return; }
                input.value = '';
                const partner = state.users.find(u => u.id === partnerId);
                const msgs = await fetchPrivateMessages(chatId);
                renderChatMessages(msgs, partner);
                updateBadges();

                if (partner && partner.online_status) {
                    setTimeout(async () => {
                        const msgs2 = await fetchPrivateMessages(chatId);
                        if (msgs2.length > 0) {
                            const last = msgs2[msgs2.length - 1];
                            if (last.sender_id === state.currentUser.id && last.status === 'sent') {
                                await updateMessageStatus(last.id, 'delivered');
                                const updated = await fetchPrivateMessages(chatId);
                                renderChatMessages(updated, partner);
                            }
                        }
                    }, 1000);
                    setTimeout(async () => {
                        const msgs2 = await fetchPrivateMessages(chatId);
                        if (msgs2.length > 0) {
                            const last = msgs2[msgs2.length - 1];
                            if (last.sender_id === state.currentUser.id) {
                                await updateMessageStatus(last.id, 'read');
                                const updated = await fetchPrivateMessages(chatId);
                                renderChatMessages(updated, partner);
                                showTypingIndicator(true);
                                clearTimeout(replyTimeout);
                                replyTimeout = setTimeout(async () => {
                                    showTypingIndicator(false);
                                    const replies = ['رائع! 😊', 'أخبرني المزيد', 'أوافقك الرأي',
                                        'واو! حقاً؟', 'جميل!', '😂', 'نعم!', '👍', 'أحب ذلك!',
                                        'جدياً؟'
                                    ];
                                    const reply = replies[Math.floor(Math.random() * replies
                                    .length)];
                                    const newMsg = await sendPrivateMessage(chatId, partner.id,
                                        reply);
                                    if (newMsg) {
                                        const updated2 = await fetchPrivateMessages(chatId);
                                        renderChatMessages(updated2, partner);
                                        updateBadges();
                                    }
                                }, 1500 + Math.random() * 1500);
                            }
                        }
                    }, 3000);
                }
            }

            function showTypingIndicator(show) {
                const indicator = document.getElementById('typingIndicator');
                if (indicator) {
                    indicator.style.display = show ? 'flex' : 'none';
                    const container = document.getElementById('cdMessages');
                    if (container) container.scrollTop = container.scrollHeight;
                }
            }

                state.rooms.push(data);
                showToast('تم إنشاء الغرفة 🎉', 'success');
                renderRooms();
                setTimeout(() => openRoomDetailPage(data.id), 400);
            });

            function showToast(message, type = '') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast' + (type ? ' ' + type : '');
                const iconMap = { 'success': 'fa-check-circle', 'error': 'fa-exclamation-circle' };
                const icon = iconMap[type] || 'fa-info-circle';
                toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
            }

            async function updateBadges() {
                if (!state.currentUser) {
                    document.getElementById('notifBadge').style.display = 'none';
                    return;
                }
                try {
                    const { count, error } = await supabase
                        .from('notifications')
                        .select('*', { count: 'exact', head: true })
                        .eq('user_id', state.currentUser.id)
                        .eq('is_read', false);
                    if (!error) {
                        const notifBadge = document.getElementById('notifBadge');
                        if (count > 0) {
                            notifBadge.textContent = count > 9 ? '9+' : count;
                            notifBadge.style.display = 'block';
                        } else {
                            notifBadge.style.display = 'none';
                        }
                    }
                } catch (e) { /* ignore */ }
            }

            window._twinzChat = function(id) { state.chatPartnerId = id;
                navigateTo('chatDetail', id); };

            // ==========================================================
            // 20. INIT
            // ==========================================================
            async function init() {
                loadState();

                const { data: session } = await supabase.auth.getSession();
                if (session?.session?.user) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', session.session.user.id)
                        .maybeSingle();
                    if (profile) {
                        state.currentUser = profile;
                        state.isLoggedIn = true;
                    }
                }

                initScreens();

                state.users = await fetchProfiles();
                state.rooms = await fetchRooms();

                if (state.isLoggedIn && state.currentUser) {
                    navigateTo('mainScreen');
                    renderMainFeed();
                } else {
                    navigateTo('splash');
                }

                updateBadges();
                setInterval(updateBadges, 30000);

                console.log('🚀 توينز v9 with WebRTC Voice Chat');
                console.log('📦 State:', state);
            }

            document.addEventListener('DOMContentLoaded', init);
            window.__twinz = { state, navigateTo, showToast, renderRooms, renderMainFeed, saveState, supabase,
                toggleVoice, stopVoice };

        })();
    </script>
</body>
</html>
