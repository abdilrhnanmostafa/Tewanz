<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>توينز - تواصل وصداقة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js">
    </script>
    <style>
        /* ============================================================
           CSS مختصر (نفس الأنماط السابقة مع بعض التعديلات)
           ============================================================ */
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --gradient: linear-gradient(135deg, #6C3CE1 0%, #8B5CF6 40%, #EC4899 100%);
            --bg: #0F0A1A;
            --bg-card: rgba(255, 255, 255, 0.06);
            --text: #F1F0F7;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-light: rgba(255, 255, 255, 0.35);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --nav-height: 68px;
            --header-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            font-family: var(--font);
            background: #0F0A1A;
            color: var(--text);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        #app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            #app {
                border-radius: 36px;
                height: 92vh;
                margin-top: 4vh;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            }
        }
        #particles-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--bg);
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: var(--nav-height);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(16px) scale(0.98);
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }
        .screen.no-nav {
            padding-bottom: 0;
        }

        /* ============================================================
           AUTH (نفس السابق)
           ============================================================ */
        #splash {
            background: var(--bg);
            justify-content: center;
            align-items: center;
            padding: 30px 24px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        #splash .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.5;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        #splash .bg-orb:nth-child(1) {
            width: 350px;
            height: 350px;
            top: -120px;
            right: -120px;
            background: var(--primary);
        }
        #splash .bg-orb:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            left: -80px;
            background: #EC4899;
            animation-delay: -4s;
        }
        #splash .bg-orb:nth-child(3) {
            width: 180px;
            height: 180px;
            top: 40%;
            left: -60px;
            background: #F59E0B;
            animation-delay: -8s;
            opacity: 0.3;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -20px) scale(1.05);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
            100% {
                transform: translate(10px, -10px) scale(1.02);
            }
        }
        #splash .logo {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.9s ease forwards;
            margin-bottom: 12px;
        }
        #splash .logo .logo-icon {
            display: inline-block;
            background: var(--gradient);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 36px;
            margin-bottom: 8px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.3);
        }
        #splash .logo .logo-text {
            display: block;
            font-size: 38px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #splash .logo .logo-sub {
            display: block;
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.5;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 4px;
            margin: 16px auto 20px;
            max-width: 320px;
            width: 100%;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .auth-tabs .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .auth-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .auth-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .auth-form {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.6s ease both;
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .auth-form .form-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .auth-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-align: right;
        }
        .auth-form .form-group .input-wrap {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 2px 18px 2px 4px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            direction: rtl;
        }
        .auth-form .form-group .input-wrap:focus-within {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.08);
        }
        .auth-form .form-group .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 8px 14px 0;
            font-size: 16px;
            color: #fff;
            outline: none;
            font-weight: 500;
            min-width: 0;
            direction: rtl;
        }
        .auth-form .form-group .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
        }
        .auth-form .form-group .input-wrap .input-icon {
            color: var(--text-light);
            font-size: 16px;
            padding: 0 4px;
            min-width: 32px;
            text-align: center;
        }
        .auth-form .form-group .input-wrap .toggle-password {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 8px;
            transition: var(--transition);
            border-radius: 50%;
        }
        .auth-form .form-group .input-wrap .toggle-password:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .auth-form .auth-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .auth-form .auth-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        .auth-form .auth-btn:hover::after {
            opacity: 1;
        }
        .auth-form .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(108, 60, 225, 0.4);
        }
        .auth-form .auth-btn:active {
            transform: scale(0.96);
        }
        .auth-form .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .auth-form .auth-btn .btn-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .auth-form .auth-btn.loading .btn-text {
            display: none;
        }
        .auth-form .auth-btn.loading .btn-spinner {
            display: block;
        }
        .auth-form .auth-links {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }
        .auth-form .auth-links a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
        }
        .auth-form .auth-links a:hover {
            color: #fff;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #F87171;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-error.show {
            display: block;
        }
        .auth-success {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #34D399;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-success.show {
            display: block;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            color: var(--text-light);
            font-size: 12px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ============================================================
           شارة التوثيق
           ============================================================ */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
            margin-right: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            line-height: 1;
            vertical-align: middle;
            animation: verifiedPulse 2.5s ease-in-out infinite;
        }
        .verified-badge-sm {
            width: 14px;
            height: 14px;
            font-size: 8px;
        }
        @keyframes verifiedPulse {
            0%,
            100% {
                box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
            }
            50% {
                box-shadow: 0 2px 16px rgba(124, 58, 237, 0.7);
            }
        }
        .verified-name {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           TOP HEADER
           ============================================================ */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 10px;
            background: rgba(15, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            min-height: var(--header-height);
        }
        .top-header .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .app-title i {
            font-size: 18px;
            -webkit-text-fill-color: initial;
            color: var(--primary-light);
        }
        .top-header .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .top-header .header-actions .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 17px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(8px);
        }
        .top-header .header-actions .icon-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            color: #fff;
            border-color: rgba(139, 92, 246, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .icon-btn:active {
            transform: scale(0.92);
        }
        .top-header .header-actions .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #EC4899;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 60px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.4);
        }

        /* ============================================================
           MAIN FEED
           ============================================================ */
        .main-feed {
            flex: 1;
            padding: 0 16px 16px;
            overflow-y: auto;
        }
        .feed-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 4px;
            margin: 12px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feed-tabs .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .feed-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .feed-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .feed-content {
            display: block;
        }
        .feed-content.hidden {
            display: none;
        }

        .person-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
        }
        .person-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .person-card:active {
            transform: scale(0.98);
