                            showToast('❌ يرجى اختيار ملف صورة', 'error');
                            this.value = '';
                            return;
                        }
                        if (file.size > 10 * 1024 * 1024) {
                            showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 10 ميجابايت)', 'error');
                            this.value = '';
                            return;
                        }
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            document.getElementById('roomCoverPreview').src = ev.target.result;
                            document.getElementById('roomCoverPreview').style.display = 'block';
                            document.getElementById('roomCoverName').textContent = '✅ تم اختيار صورة جديدة';
                            state.roomCoverData = ev.target.result;
                            state.roomCoverFile = file;
                        };
                        reader.readAsDataURL(file);
                    }
                };
            }

            window.saveRoomSettings = async function(roomId) {
                const name = document.getElementById('roomNameInput').value.trim();
                const description = document.getElementById('roomDescInput').value.trim();
                let bg_url = null;

                if (state.roomCoverFile) {
                    try {
                        const file = state.roomCoverFile;
                        const fileName =
                            `room_${roomId}_${Date.now()}.${file.name.split('.').pop()}`;
                        const { data, error: uploadError } = await supabase.storage
                            .from('room_covers')
                            .upload(fileName, file);
                        if (uploadError) {
                            console.warn('Upload failed, using base64 fallback:', uploadError);
                            bg_url = state.roomCoverData;
                            showToast('⚠️ تم حفظ الصورة بتنسيق base64 (قد تكون كبيرة)', '');
                        } else {
                            const { data: urlData } = supabase.storage
                                .from('room_covers')
                                .getPublicUrl(fileName);
                            bg_url = urlData.publicUrl;
                        }
                    } catch (e) {
                        console.error('Error uploading room cover:', e);
                        bg_url = state.roomCoverData;
                        showToast('⚠️ تم حفظ الصورة بتنسيق base64', '');
                    }
                }

                const updateData = { name, description };
                if (bg_url) updateData.bg_url = bg_url;

                const { error } = await supabase
                    .from('rooms')
                    .update(updateData)
                    .eq('id', roomId);
                if (error) { showToast('خطأ في حفظ الإعدادات: ' + error.message, 'error'); return; }

                const room = state.rooms.find(r => r.id == roomId);
                if (room) {
                    room.name = name;
                    room.description = description;
                    if (bg_url) room.bg_url = bg_url;
                }

                showToast('✅ تم حفظ إعدادات الغرفة', 'success');
                document.getElementById('settingsModal').classList.remove('active');
                updateNavVisibility();
                renderRooms();
                if (state.currentRoomId == roomId) {
                    openRoomDetailPage(roomId);
                }
                state.roomCoverData = null;
                state.roomCoverFile = null;
                document.getElementById('roomCoverInput').value = '';
            };

            document.getElementById('settingsModalClose').addEventListener('click', function() {
                document.getElementById('settingsModal').classList.remove('active');
                updateNavVisibility();
                state.roomCoverData = null;
                state.roomCoverFile = null;
                document.getElementById('roomCoverInput').value = '';
            });

            // ==========================================================
            // 17. MUSIC PLAYER
            // ==========================================================
            function setupMusicControls() {
                const playBtn = document.getElementById('mpPlayBtn');
                const progressBar = document.getElementById('mpProgressBar');
                const progressFill = document.getElementById('mpProgressFill');
                const currentTimeEl = document.getElementById('mpCurrentTime');
                const durationEl = document.getElementById('mpDuration');
                const volBar = document.getElementById('mpVolBar');
                const volFill = document.getElementById('mpVolFill');
                const fileBtn = document.getElementById('mpFileBtn');
                const fileInput = document.getElementById('mpFileInput');

                volFill.style.width = (state.music.volume * 100) + '%';
                volBar.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    state.music.volume = x;
                    volFill.style.width = (x * 100) + '%';
                    if (audioElement) audioElement.volume = x;
                    saveState();
                });

                fileBtn.addEventListener('click', function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول أولاً', 'error'); return; }
                    fileInput.click();
                });
                fileInput.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('audio/')) { showToast('يرجى اختيار ملف صوتي', 'error'); return; }
                    const url = URL.createObjectURL(file);
                    const title = file.name.replace(/\.[^/.]+$/, '');
                    loadLocalTrack(url, title, 'من هاتفي');
                    this.value = '';
                });

                playBtn.addEventListener('click', function() {
                    if (!state.currentUser) { showToast('يرجى تسجيل الدخول', 'error'); return; }
                    if (!audioElement || !audioElement.src) { showToast('يرجى اختيار أغنية أولاً', 'error');
                        return; }
                    if (audioElement.paused) {
                        audioElement.play().catch(() => { showToast('حدث خطأ في التشغيل', 'error'); });
                        state.music.playing = true;
                        this.innerHTML = '<i class="fas fa-pause"></i>';
                        startMusicProgress();
                        showToast('🎵 تشغيل الموسيقى', 'success');
                    } else {
                        audioElement.pause();
                        state.music.playing = false;
                        this.innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(musicInterval);
                        musicInterval = null;
                    }
                    saveState();
                });

                progressBar.addEventListener('click', function(e) {
                    if (!audioElement || !audioElement.duration) return;
                    const rect = this.getBoundingClientRect();
                    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    audioElement.currentTime = x * audioElement.duration;
                });

                document.getElementById('mpPrevBtn').addEventListener('click', function() {
                    if (state.music.isLocal && audioElement && audioElement.src) {
                        audioElement.currentTime = 0;
                    } else {
                        showToast('لا توجد أغنية سابقة', '');
                    }
                });
                document.getElementById('mpNextBtn').addEventListener('click', function() {
                    fileInput.click();
                });

                if (audioElement) {
                    audioElement.addEventListener('loadedmetadata', function() {
                        const dur = this.duration;
                        if (dur && isFinite(dur)) durationEl.textContent = formatTime(dur);
                    });
                    audioElement.addEventListener('timeupdate', function() {
                        if (this.duration && isFinite(this.duration)) {
                            const pct = (this.currentTime / this.duration) * 100;
                            progressFill.style.width = pct + '%';
                            currentTimeEl.textContent = formatTime(this.currentTime);
                            state.music.progress = this.currentTime / this.duration;
                        }
                    });
                    audioElement.addEventListener('ended', function() {
                        state.music.playing = false;
                        document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                        clearInterval(musicInterval);
                        musicInterval = null;
                        progressFill.style.width = '0%';
                        currentTimeEl.textContent = '00:00';
                        saveState();
                        showToast('🎵 انتهت الأغنية', '');
                    });
                }
                if (state.music.isLocal && state.music.currentTrack) {
                    const track = state.music.currentTrack;
                    if (track.url) {
                        loadLocalTrack(track.url, track.title || 'أغنية محلية', track.artist || 'من هاتفي');
                        if (state.music.playing && audioElement) {
                            audioElement.play().catch(() => {});
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            startMusicProgress();
                        }
                    }
                }
            }

            function loadLocalTrack(url, title, artist) {
                if (audioElement) { audioElement.pause();
                    audioElement.src = ''; }
                audioElement = new Audio(url);
                audioElement.volume = state.music.volume || 0.7;
                document.getElementById('mpTrackTitle').textContent = title || 'أغنية محلية';
                document.getElementById('mpTrackArtist').textContent = artist || 'من هاتفي';
                document.getElementById('mpDuration').textContent = 'جاري التحميل...';
                document.getElementById('mpProgressFill').style.width = '0%';
                document.getElementById('mpCurrentTime').textContent = '00:00';
                document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                state.music.isLocal = true;
                state.music.currentTrack = { url, title, artist };
                state.music.playing = false;
                audioElement.addEventListener('loadedmetadata', function() {
                    const dur = this.duration;
                    if (dur && isFinite(dur)) document.getElementById('mpDuration').textContent = formatTime(dur);
                });
                audioElement.addEventListener('timeupdate', function() {
                    if (this.duration && isFinite(this.duration)) {
                        const pct = (this.currentTime / this.duration) * 100;
                        document.getElementById('mpProgressFill').style.width = pct + '%';
                        document.getElementById('mpCurrentTime').textContent = formatTime(this.currentTime);
                        state.music.progress = this.currentTime / this.duration;
                    }
                });
                audioElement.addEventListener('ended', function() {
                    state.music.playing = false;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                    clearInterval(musicInterval);
                    musicInterval = null;
                    document.getElementById('mpProgressFill').style.width = '0%';
                    document.getElementById('mpCurrentTime').textContent = '00:00';
                    saveState();
                    showToast('🎵 انتهت الأغنية', '');
                });
                audioElement.addEventListener('error', function() { showToast('حدث خطأ في تشغيل الملف', 'error'); });
                showToast(`🎵 تم تحميل: ${title}`, 'success');
                saveState();
                audioElement.play().then(() => {
                    state.music.playing = true;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-pause"></i>';
                    startMusicProgress();
                }).catch(() => {
                    state.music.playing = false;
                    document.getElementById('mpPlayBtn').innerHTML = '<i class="fas fa-play"></i>';
                });
            }

            function startMusicProgress() {
                clearInterval(musicInterval);
                musicInterval = setInterval(() => {
                    if (!audioElement || audioElement.paused) return;
                    if (audioElement.duration && isFinite(audioElement.duration)) {
                        const pct = (audioElement.currentTime / audioElement.duration) * 100;
                        document.getElementById('mpProgressFill').style.width = pct + '%';
                        document.getElementById('mpCurrentTime').textContent = formatTime(audioElement.currentTime);
                        state.music.progress = audioElement.currentTime / audioElement.duration;
                        saveState();
                    }
                }, 200);
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec) || !isFinite(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

                document.getElementById('cdName').innerHTML = renderVerifiedName(partner.full_name || 'مستخدم', partner);

            function renderChatMessages(msgs, partner) {
                const container = document.getElementById('cdMessages');
                const typingIndicator = document.getElementById('typingIndicator');
                container.innerHTML = '';
                container.appendChild(typingIndicator);
                if (msgs.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-chat';
                    empty.innerHTML =
                        `<i class="fas fa-comment-dots"></i><h4>لا توجد رسائل</h4><p>قل مرحباً لـ ${partner.full_name || 'المستخدم'}</p>`;
                    container.appendChild(empty);
                    return;
                }
                msgs.forEach(msg => {
                    const isMe = msg.sender_id === state.currentUser.id;
                    const sender = isMe ? state.currentUser : partner;
                    const wrapper = document.createElement('div');
                    wrapper.className = `msg-wrapper ${isMe ? 'sent' : 'received'}`;
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.textContent = msg.content;
                    const meta = document.createElement('div');
                    meta.className = 'msg-meta';
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit',
                        minute: '2-digit' });
                    meta.appendChild(timeSpan);
                    if (isMe) {
                        const statusSpan = document.createElement('span');
                        statusSpan.className = 'status';
                        if (msg.status === 'sent') statusSpan.innerHTML = '<i class="fas fa-check"></i>';
                        else if (msg.status === 'delivered') statusSpan.innerHTML =
                            '<i class="fas fa-check-double" style="color:var(--text-light);"></i>';
                        else if (msg.status === 'read') statusSpan.innerHTML =
                            '<i class="fas fa-check-double" style="color:#34D399;"></i>';
                        meta.appendChild(statusSpan);
                    }
                    wrapper.appendChild(bubble);
                    wrapper.appendChild(meta);
                    container.appendChild(wrapper);
                });
                container.scrollTop = container.scrollHeight;
            }

            async function sendChatMessage() {
                const overlay = document.getElementById('chatDetailOverlay');
                const chatId = parseInt(overlay.dataset.chatId);
                const partnerId = overlay.dataset.partnerId;
                if (!chatId || !partnerId) return;
                if (state.currentUser.is_muted) {
                    showToast('🔇 تم كتم صوتك، لا يمكنك إرسال رسائل', 'error');
                    return;
                }
                const input = document.getElementById('cdInput');
                const text = input.value.trim();
                if (!text) return;
                const msg = await sendPrivateMessage(chatId, state.currentUser.id, text);
                if (!msg) { showToast('فشل إرسال الرسالة', 'error'); return; }
                input.value = '';
                const partner = state.users.find(u => u.id === partnerId);
                const msgs = await fetchPrivateMessages(chatId);
                renderChatMessages(msgs, partner);
                updateBadges();

                if (partner && partner.online_status) {
                    setTimeout(async () => {
                        const msgs2 = await fetchPrivateMessages(chatId);
                        if (msgs2.length > 0) {
                            const last = msgs2[msgs2.length - 1];
                            if (last.sender_id === state.currentUser.id && last.status === 'sent') {
                                await updateMessageStatus(last.id, 'delivered');
                                const updated = await fetchPrivateMessages(chatId);
                                renderChatMessages(updated, partner);
                            }
                        }
                    }, 1000);
                    setTimeout(async () => {
                        const msgs2 = await fetchPrivateMessages(chatId);
                        if (msgs2.length > 0) {
                            const last = msgs2[msgs2.length - 1];
                            if (last.sender_id === state.currentUser.id) {
                                await updateMessageStatus(last.id, 'read');
                                const updated = await fetchPrivateMessages(chatId);
                                renderChatMessages(updated, partner);
                                showTypingIndicator(true);
                                clearTimeout(replyTimeout);
                                replyTimeout = setTimeout(async () => {
                                    showTypingIndicator(false);
                                    const replies = ['رائع! 😊', 'أخبرني المزيد', 'أوافقك الرأي',
                                        'واو! حقاً؟', 'جميل!', '😂', 'نعم!', '👍', 'أحب ذلك!',
                                        'جدياً؟'
                                    ];
                                    const reply = replies[Math.floor(Math.random() * replies
                                    .length)];
                                    const newMsg = await sendPrivateMessage(chatId, partner.id,
                                        reply);
                                    if (newMsg) {
                                        const updated2 = await fetchPrivateMessages(chatId);
                                        renderChatMessages(updated2, partner);
                                        updateBadges();
                                    }
                                }, 1500 + Math.random() * 1500);
                            }
                        }
                    }, 3000);
                }
            }

                        <div class="profile-name-area">
                            <div class="pname">${user.full_name || 'مستخدم'} ${verifiedBadge}</div>
                            <div class="page">${user.age || '?'} سنة · ${user.location || 'غير محدد'}</div>
                        </div>
                    </div>
                    <div class="profile-info-section">
                        <div class="bio-text">${user.bio || 'لا توجد سيرة ذاتية'}</div>
                        <div class="interests-tags">
                            ${(user.interests || []).map(t => `<span class="tag highlight">${t}</span>`).join('')}
                            ${(!user.interests || user.interests.length === 0) ? '<span class="tag">لا توجد اهتمامات</span>' : ''}
                        </div>
                        <div class="profile-stat-row">
                            <div class="stat"><div class="num">${followersCount}</div><div class="label">المتابعون</div></div>
                            <div class="stat"><div class="num">${followingCount}</div><div class="label">يتابع</div></div>
                            <div class="stat"><div class="num">${state.rooms.length}</div><div class="label">غرف</div></div>
                            <div class="stat"><div class="num">${state.favorites.length}</div><div class="label">المفضلة</div></div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        <button class="pbtn primary" id="editProfileBtn">تعديل الملف</button>
                        <button class="pbtn outline" id="signoutBtn">تسجيل الخروج</button>
                    </div>
                `;

                // تغيير الصورة الشخصية
                document.getElementById('changeAvatarBtn').addEventListener('click', function() {
                    document.getElementById('avatarFileInput').click();
                });

                document.getElementById('avatarFileInput').onchange = async function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) {
                        showToast('❌ يرجى اختيار ملف صورة', 'error');
                        this.value = '';
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت)', 'error');
                        this.value = '';
                        return;
                    }
                    try {
                        showToast('⏳ جاري رفع الصورة...', '');
                        const fileName =
                            `avatar_${user.id}_${Date.now()}.${file.name.split('.').pop()}`;
                        const { data, error: uploadError } = await supabase.storage
                            .from('avatars')
                            .upload(fileName, file);
                        let avatarUrl;
                        if (uploadError) {
                            console.warn('Upload failed, using base64 fallback:', uploadError);
                            const reader = new FileReader();
                            avatarUrl = await new Promise((resolve) => {
                                reader.onload = function(ev) { resolve(ev.target.result); };
                                reader.readAsDataURL(file);
                            });
                            showToast('⚠️ تم حفظ الصورة بتنسيق base64 (قد تكون بطيئة)', '');
                        } else {
                            const { data: urlData } = supabase.storage
                                .from('avatars')
                                .getPublicUrl(fileName);
                            avatarUrl = urlData.publicUrl;
                        }
                        const { error: updateError } = await supabase
                            .from('profiles')
                            .update({ avatar_url: avatarUrl })
                            .eq('id', user.id);
                        if (updateError) {
                            showToast('❌ فشل تحديث قاعدة البيانات: ' + updateError.message, 'error');
                            return;
                        }
                        user.avatar_url = avatarUrl;
                        showToast('✅ تم تحديث الصورة الشخصية بنجاح', 'success');
                        renderProfile();
                        renderMainFeed();
                    } catch (err) {
                        showToast('❌ حدث خطأ: ' + err.message, 'error');
                        console.error('Avatar upload error:', err);
                    }
                    this.value = '';
                };

                // تغيير الغلاف
                document.getElementById('changeCoverBtn').addEventListener('click', function() {
                    document.getElementById('coverFileInput').click();
                });

                document.getElementById('coverFileInput').onchange = async function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) {
                        showToast('❌ يرجى اختيار ملف صورة', 'error');
                        this.value = '';
                        return;
                    }
                    if (file.size > 10 * 1024 * 1024) {
                        showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 10 ميجابايت)', 'error');
                        this.value = '';
                        return;
                    }
                    try {
                        showToast('⏳ جاري رفع الغلاف...', '');
                        const fileName =
                            `cover_${user.id}_${Date.now()}.${file.name.split('.').pop()}`;
                        const { data, error: uploadError } = await supabase.storage
                            .from('covers')
                            .upload(fileName, file);
                        let coverUrl;
                        if (uploadError) {
                            console.warn('Upload failed, using base64 fallback:', uploadError);
                            const reader = new FileReader();
                            coverUrl = await new Promise((resolve) => {
                                reader.onload = function(ev) { resolve(ev.target.result); };
                                reader.readAsDataURL(file);
                            });
                            showToast('⚠️ تم حفظ الغلاف بتنسيق base64', '');
                        } else {
                            const { data: urlData } = supabase.storage
                                .from('covers')
                                .getPublicUrl(fileName);
                            coverUrl = urlData.publicUrl;
                        }
                        const { error: updateError } = await supabase
                            .from('profiles')
                            .update({ cover_url: coverUrl })
                            .eq('id', user.id);
                        if (updateError) {
                            showToast('❌ فشل تحديث قاعدة البيانات: ' + updateError.message, 'error');
                            return;
                        }
                        user.cover_url = coverUrl;
                        showToast('✅ تم تحديث غلاف الملف الشخصي بنجاح', 'success');
                        renderProfile();
                    } catch (err) {
                        showToast('❌ حدث خطأ: ' + err.message, 'error');
                        console.error('Cover upload error:', err);
                    }
                    this.value = '';
                };

                // تعديل الملف الشخصي
                document.getElementById('editProfileBtn').addEventListener('click', function() {
                    const newName = prompt('الاسم:', user.full_name || '');
                    if (newName !== null && newName.trim()) user.full_name = newName.trim();
                    const newAge = prompt('العمر:', user.age || '');
                    if (newAge !== null && !isNaN(newAge)) user.age = parseInt(newAge);
                    const newBio = prompt('السيرة الذاتية:', user.bio || '');
                    if (newBio !== null) user.bio = newBio.trim();
                    const newLocation = prompt('الموقع:', user.location || '');
                    if (newLocation !== null) user.location = newLocation.trim();
                    const interestsInput = prompt('الاهتمامات (افصل بينها بفاصلة):', (user.interests || []).join(
                        ', '));
                    if (interestsInput !== null) {
                        user.interests = interestsInput.split(',').map(s => s.trim()).filter(s => s);
                    }
                    supabase.from('profiles').update({
                        full_name: user.full_name,
                        age: user.age,
                        bio: user.bio,
                        location: user.location,
                        interests: user.interests
                    }).eq('id', user.id).then(() => {
                        saveState();
                        renderProfile();
                        renderMainFeed();
                        showToast('✅ تم تحديث الملف الشخصي', 'success');
                    });
                });

                document.getElementById('signoutBtn').addEventListener('click', function() {
                    state.currentUser = null;
                    state.isLoggedIn = false;
                    if (audioElement) { audioElement.pause();
                        audioElement.src = ''; }
                    stopVoice();
                    cleanupWebRTC();
                    clearInterval(musicInterval);
                    musicInterval = null;
                    saveState();
                    showToast('تم تسجيل الخروج', '');
                    navigateTo('splash');
                });
            }

            // ==========================================================
            // 21. NOTIFICATIONS & SEARCH
            // ==========================================================
            async function renderNotifications() {
                const list = document.getElementById('notifList');
                if (!state.currentUser) {
                    list.innerHTML =
                        `<div style="text-align:center;padding:30px 20px;color:var(--text-secondary);"><i class="fas fa-bell-slash" style="font-size:32px;color:var(--text-light);display:block;margin-bottom:8px;"></i><p>سجل الدخول لرؤية الإشعارات</p></div>`;
                    return;
                }
                const notifs = await fetchNotifications(state.currentUser.id);
                if (notifs.length === 0) {
                    list.innerHTML =
                        `<div style="text-align:center;padding:30px 20px;color:var(--text-secondary);"><i class="fas fa-bell-slash" style="font-size:32px;color:var(--text-light);display:block;margin-bottom:8px;"></i><p>لا توجد إشعارات</p></div>`;
                    return;
                }
                list.innerHTML = notifs.map(n => {
                    let content = n.content || {};
                    let text = 'إشعار جديد';
                    if (n.type === 'friend_request') text =
                        `<strong>${content.sender_name || 'مستخدم'}</strong> أرسل لك طلب صداقة`;
                    else if (n.type === 'message') text =
                        `<strong>${content.sender_name || 'مستخدم'}</strong> أرسل لك رسالة`;
                    else if (n.type === 'room_invite') text =
                        `<strong>${content.sender_name || 'مستخدم'}</strong> دعاك إلى غرفة ${content.room_name || ''}`;
                    return `
                        <div class="notif-item"><div class="nicon"><i class="fas ${n.type === 'friend_request' ? 'fa-user-plus' : n.type === 'message' ? 'fa-comment' : 'fa-microphone'}"></i></div>
                        <div class="ntext">${text}</div>
                        <div class="ntime">${new Date(n.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
                    `;
                }).join('');
            }

            document.getElementById('notifBtn').addEventListener('click', function() { renderNotifications();
                document.getElementById('notifOverlay').classList.add('active'); });
            document.getElementById('notifBtnRooms').addEventListener('click', function() { renderNotifications();
                document.getElementById('notifOverlay').classList.add('active'); });
            document.getElementById('notifBtnChat').addEventListener('click', function() { renderNotifications();
                document.getElementById('notifOverlay').classList.add('active'); });
            document.getElementById('notifClose').addEventListener('click', function() { document.getElementById(
                    'notifOverlay').classList.remove('active'); });
            document.getElementById('notifOverlay').addEventListener('click', function(e) { if (e.target === this) this
                    .classList.remove('active'); });

            function renderSearch(query) {
                const container = document.getElementById('searchResults');
                if (!query || query.trim() === '') {
                    container.innerHTML =
                        `<div class="empty-search"><i class="fas fa-search"></i><p>ابحث عن أشخاص أو غرف</p></div>`;
                    return;
                }
                const q = query.trim().toLowerCase();
                const users = state.users.filter(u =>
                    (u.full_name || '').includes(q) ||
                    (u.interests || []).some(i => i.includes(q)) ||
                    (u.location || '').includes(q)
                );
                const rooms = state.rooms.filter(r => (r.name || '').includes(q));
                if (users.length === 0 && rooms.length === 0) {
                    container.innerHTML =
                        `<div class="empty-search"><i class="fas fa-search"></i><p>لا توجد نتائج لـ "${query}"</p></div>`;
                    return;
                }
                let html = '';
                if (users.length > 0) {
                    html += `<div style="font-weight:600;padding:8px 0;color:var(--primary-light);">👤 أشخاص</div>`;
                    html += users.slice(0, 10).map(u => {
                        const nameDisplay = renderVerifiedName(u.full_name || 'مستخدم', u);
                        const isFollowing = state.following.includes(u.id);
                        return `<div class="result-item" data-id="${u.id}" data-type="user">
                            <div class="ravatar" style="background-image:url('${u.avatar_url || 'https://i.pravatar.cc/400?img=' + (u.id % 10 + 1)}')"></div>
                            <div class="rinfo">
                                <div class="rname">${nameDisplay}</div>
                                <div class="rsub">${u.location || 'غير محدد'} · ${u.age || '?'} سنة · ${state.followCounts[u.id] || 0} متابع</div>
                            </div>
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="event.stopPropagation();window._toggleFollow('${u.id}')" style="font-size:9px;padding:2px 10px;">${isFollowing ? 'متابَع' : 'متابعة'}</button>
                        </div>`;
                    }).join('');
                }
                if (rooms.length > 0) {
                    html += `<div style="font-weight:600;padding:8px 0;color:var(--primary-light);">🎤 غرف</div>`;
                    html += rooms.slice(0, 10).map(r =>
                        `<div class="result-item" data-id="${r.id}" data-type="room" onclick="window._openRoomDetail(${r.id})">
                            <div class="ravatar" style="background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;">🎤</div>
                            <div class="rinfo"><div class="rname">${r.name}</div><div class="rsub">${r.description || 'لا يوجد وصف'} · ${r.occupants ? r.occupants.length : 0}/8</div></div>
                        </div>`
                    ).join('');
                }
                container.innerHTML = html;
                container.querySelectorAll('.result-item[data-type="user"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        state.chatPartnerId = id;
                        document.getElementById('searchOverlay').classList.remove('active');
                        navigateTo('chatDetail', id);
                    });
                });
                container.querySelectorAll('.result-item[data-type="room"]').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        document.getElementById('searchOverlay').classList.remove('active');
                        openRoomDetailPage(parseInt(id));
                    });
                });
            }

            document.getElementById('searchBtn').addEventListener('click', function() { document.getElementById(
                    'searchOverlay').classList.add('active');
                document.getElementById('searchInput').value = '';
                document.getElementById('searchInput').focus();
                renderSearch(''); });
            document.getElementById('searchBtnRooms').addEventListener('click', function() { document.getElementById(
                    'searchOverlay').classList.add('active');
                document.getElementById('searchInput').value = '';
                document.getElementById('searchInput').focus();
                renderSearch(''); });
            document.getElementById('searchBtnChat').addEventListener('click', function() { document.getElementById(
                    'searchOverlay').classList.add('active');
                document.getElementById('searchInput').value = '';
                document.getElementById('searchInput').focus();
                renderSearch(''); });
            document.getElementById('searchClose').addEventListener('click', function() { document.getElementById(
                    'searchOverlay').classList.remove('active'); });
            document.getElementById('searchInput').addEventListener('input', function() { renderSearch(this.value); });

            // ==========================================================
            // 22. TABS, BOTTOM NAV, CREATE ROOM, BADGES, TOAST, INIT
            // ==========================================================
            document.querySelectorAll('.feed-tabs .tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.feed-tabs .tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.feed-content').forEach(c => c.classList.add('hidden'));
                    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove(
                        'hidden');
                    state.activeTab = tab;
                });
            });

            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    const screen = this.dataset.screen;
                    if (screen && screens[screen]) {
                        document.getElementById('chatDetailOverlay').classList.remove('active');
                        document.getElementById('roomDetailPage').classList.remove('active');
                        document.getElementById('notifOverlay').classList.remove('active');
                        document.getElementById('searchOverlay').classList.remove('active');
                        document.getElementById('settingsModal').classList.remove('active');
                        navigateTo(screen);
                    }
                });
            });

            document.getElementById('createRoomBtn').addEventListener('click', async function() {
                if (!state.currentUser) { showToast('يرجى تسجيل الدخول أولاً', 'error'); return; }
                const name = prompt('أدخل اسم الغرفة:');
                if (!name || name.trim() === '') return;
                const description = prompt('أدخل وصف الغرفة:') || '';
                const bgOptions = [
                    'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=600',
                    'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=600',
                    'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600',
                    'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600',
                    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600'
                ];
                const randomBg = bgOptions[Math.floor(Math.random() * bgOptions.length)];
                const { data, error } = await supabase
                    .from('rooms')
                    .insert({
                        name: name.trim(),
                        host_id: state.currentUser.id,
                        bg_url: randomBg,
                        description: description
                    })
                    .select()
                    .single();
                if (error) { showToast('فشل إنشاء الغرفة', 'error');
                    console.error(error); return; }
                state.rooms.push(data);
                showToast('تم إنشاء الغرفة 🎉', 'success');
                renderRooms();
                setTimeout(() => openRoomDetailPage(data.id), 400);
            });

            function showToast(message, type = '') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast' + (type ? ' ' + type : '');
                const iconMap = { 'success': 'fa-check-circle', 'error': 'fa-exclamation-circle' };
                const icon = iconMap[type] || 'fa-info-circle';
                toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
            }

            async function updateBadges() {
                if (!state.currentUser) {
                    document.getElementById('notifBadge').style.display = 'none';
                    return;
                }
                try {
                    const { count, error } = await supabase
                        .from('notifications')
                        .select('*', { count: 'exact', head: true })
                        .eq('user_id', state.currentUser.id)
                        .eq('is_read', false);
                    if (!error) {
                        const notifBadge = document.getElementById('notifBadge');
                        if (count > 0) {
                            notifBadge.textContent = count > 9 ? '9+' : count;
                            notifBadge.style.display = 'block';
                        } else {
                            notifBadge.style.display = 'none';
                        }
                    }
                } catch (e) { /* ignore */ }
            }

            // ==========================================================
            // 23. WINDOW HELPERS
            // ==========================================================
            window._twinzChat = function(id) { state.chatPartnerId = id;
                navigateTo('chatDetail', id); };
            window._toggleFavorite = toggleFavorite;
            window._toggleFollow = toggleFollow;
            window._openRoomDetail = openRoomDetailPage;

            // ==========================================================
            // 24. INIT
            // ==========================================================
            async function init() {
                loadState();
                await loadAdminSettings();

                const { data: session } = await supabase.auth.getSession();
                if (session?.session?.user) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', session.session.user.id)
                        .maybeSingle();
                    if (profile) {
                        if (profile.is_banned) {
                            showToast(`🚫 حسابك محظور. السبب: ${profile.ban_reason || 'لا يوجد سبب'}`, 'error');
                        } else if (profile.is_kicked) {
                            showToast('🚪 تم طردك من التطبيق مؤقتاً.', 'error');
                        } else {
                            state.currentUser = profile;
                            state.isLoggedIn = true;
                            await loadUserFavorites();
                            await loadFollowData();
                        }
                    }
                }

                initScreens();

                state.users = await fetchProfiles();
                state.rooms = await fetchRooms();

                if (state.isLoggedIn && state.currentUser) {
                    navigateTo('mainScreen');
                    renderMainFeed();
                } else {
                    navigateTo('splash');
                }

                updateBadges();
                setInterval(updateBadges, 30000);

                console.log('🚀 توينز — الإصدار النهائي مع دعم كامل للوحة التحكم');
                console.log('📦 State:', state);
            }

            document.addEventListener('DOMContentLoaded', init);
            window.__twinz = { state, navigateTo, showToast, renderRooms, renderMainFeed, saveState, supabase };

        })();
    </script>
</body>
</html>
