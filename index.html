<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>توينز - تواصل وصداقة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js">
    </script>
    <style>
        /* ============================================================
           CSS VARIABLES & RESET
           ============================================================ */
        :root {
            --primary: #6C3CE1;
            --primary-dark: #5A2DBA;
            --primary-light: #8B5CF6;
            --primary-lighter: #A78BFA;
            --gradient: linear-gradient(135deg, #6C3CE1 0%, #8B5CF6 40%, #EC4899 100%);
            --bg: #0F0A1A;
            --bg-card: rgba(255, 255, 255, 0.06);
            --text: #F1F0F7;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-light: rgba(255, 255, 255, 0.35);
            --shadow: 0 8px 40px rgba(108, 60, 225, 0.25);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            --nav-height: 68px;
            --header-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            font-family: var(--font);
            background: #0F0A1A;
            color: var(--text);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        #app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 768px) {
            #app {
                border-radius: 36px;
                height: 92vh;
                margin-top: 4vh;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            }
        }
        #particles-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--bg);
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: var(--nav-height);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(16px) scale(0.98);
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }
        .screen.no-nav {
            padding-bottom: 0;
        }

        /* ============================================================
           AUTH SPLASH - تسجيل الدخول / إنشاء حساب
           ============================================================ */
        #splash {
            background: var(--bg);
            justify-content: center;
            align-items: center;
            padding: 30px 24px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        #splash .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.5;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        #splash .bg-orb:nth-child(1) {
            width: 350px;
            height: 350px;
            top: -120px;
            right: -120px;
            background: var(--primary);
        }
        #splash .bg-orb:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            left: -80px;
            background: #EC4899;
            animation-delay: -4s;
        }
        #splash .bg-orb:nth-child(3) {
            width: 180px;
            height: 180px;
            top: 40%;
            left: -60px;
            background: #F59E0B;
            animation-delay: -8s;
            opacity: 0.3;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -20px) scale(1.05);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
            100% {
                transform: translate(10px, -10px) scale(1.02);
            }
        }

        #splash .logo {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.9s ease forwards;
            margin-bottom: 12px;
        }
        #splash .logo .logo-icon {
            display: inline-block;
            background: var(--gradient);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 36px;
            margin-bottom: 8px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.3);
        }
        #splash .logo .logo-text {
            display: block;
            font-size: 38px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #splash .logo .logo-sub {
            display: block;
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.5;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Auth Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 4px;
            margin: 16px auto 20px;
            max-width: 320px;
            width: 100%;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .auth-tabs .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .auth-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .auth-tabs .tab-btn:active {
            transform: scale(0.96);
        }

        /* Auth Forms */
        .auth-form {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.6s ease both;
            display: none;
        }
        .auth-form.active {
            display: block;
        }

        .auth-form .form-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .auth-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-align: right;
        }
        .auth-form .form-group .input-wrap {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 2px 18px 2px 4px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            direction: rtl;
        }
        .auth-form .form-group .input-wrap:focus-within {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.08);
        }
        .auth-form .form-group .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 8px 14px 0;
            font-size: 16px;
            color: #fff;
            outline: none;
            font-weight: 500;
            min-width: 0;
            direction: rtl;
        }
        .auth-form .form-group .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
        }
        .auth-form .form-group .input-wrap .input-icon {
            color: var(--text-light);
            font-size: 16px;
            padding: 0 4px;
            min-width: 32px;
            text-align: center;
        }

        .auth-form .form-group .input-wrap .toggle-password {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 8px;
            transition: var(--transition);
            border-radius: 50%;
        }
        .auth-form .form-group .input-wrap .toggle-password:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .auth-form .auth-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .auth-form .auth-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        .auth-form .auth-btn:hover::after {
            opacity: 1;
        }
        .auth-form .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(108, 60, 225, 0.4);
        }
        .auth-form .auth-btn:active {
            transform: scale(0.96);
        }
        .auth-form .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .auth-form .auth-btn .btn-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .auth-form .auth-btn.loading .btn-text {
            display: none;
        }
        .auth-form .auth-btn.loading .btn-spinner {
            display: block;
        }

        .auth-form .auth-links {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }
        .auth-form .auth-links a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
        }
        .auth-form .auth-links a:hover {
            color: #fff;
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #F87171;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-error.show {
            display: block;
        }

        .auth-success {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #34D399;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-success.show {
            display: block;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            color: var(--text-light);
            font-size: 12px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ============================================================
           MAIN APP STYLES (unchanged)
           ============================================================ */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 10px;
            background: rgba(15, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            min-height: var(--header-height);
        }
        .top-header .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .app-title i {
            font-size: 18px;
            -webkit-text-fill-color: initial;
            color: var(--primary-light);
        }
        .top-header .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .top-header .header-actions .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 17px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(8px);
        }
        .top-header .header-actions .icon-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            color: #fff;
            border-color: rgba(139, 92, 246, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .icon-btn:active {
            transform: scale(0.92);
        }
        .top-header .header-actions .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #EC4899;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 60px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.4);
        }
        .main-feed {
            flex: 1;
            padding: 0 16px 16px;
            overflow-y: auto;
        }
        .feed-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 4px;
            margin: 12px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feed-tabs .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .feed-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .feed-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .feed-content {
            display: block;
        }
        .feed-content.hidden {
            display: none;
        }
        .person-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
        }
        .person-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .person-card:active {
            transform: scale(0.98);
        }
        .person-card .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a1f3d;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .person-card .avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #34D399;
            border: 2px solid var(--bg);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }
        .person-card .avatar .online-dot.offline {
            background: #4B5563;
            box-shadow: none;
        }
        .person-card .info {
            flex: 1;
            min-width: 0;
        }
        .person-card .info .name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .person-card .info .name .verified {
            color: #60A5FA;
            font-size: 13px;
        }
        .person-card .info .sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .person-card .info .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .person-card .info .interests .tag {
            font-size: 9px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 60px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .person-card .action-btn-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--gradient);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.2);
        }
        .person-card .action-btn-sm:hover {
            transform: scale(1.1);
        }
        .person-card .action-btn-sm:active {
            transform: scale(0.90);
        }
        .soul-match-card {
            background: var(--gradient);
            border-radius: var(--radius);
            padding: 24px;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.25);
            position: relative;
            overflow: hidden;
        }
        .soul-match-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            pointer-events: none;
        }
        .soul-match-card h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
        }
        .soul-match-card p {
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 12px;
            position: relative;
        }
        .soul-match-card .match-percent {
            font-size: 40px;
            font-weight: 800;
            position: relative;
        }
        .soul-match-card .match-sub {
            opacity: 0.7;
            font-size: 13px;
            position: relative;
        }

        .voice-rooms {
            flex: 1;
            padding: 12px 16px 16px;
            overflow-y: auto;
        }
        .voice-rooms .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .voice-rooms .room-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .voice-rooms .room-header .create-btn {
            background: var(--gradient);
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .voice-rooms .room-header .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(108, 60, 225, 0.3);
        }
        .voice-rooms .room-header .create-btn:active {
            transform: scale(0.96);
        }
        .room-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
            cursor: pointer;
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }
        .room-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(108, 60, 225, 0.05), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
        }
        .room-card:hover::before {
            opacity: 1;
        }
        .room-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .room-card:active {
            transform: scale(0.98);
        }
        .room-card .room-bg-preview {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background-size: cover;
            background-position: center;
            filter: blur(20px);
            z-index: 0;
        }
        .room-card .room-content {
            position: relative;
            z-index: 1;
        }
        .room-card .room-title {
            font-weight: 700;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .room-card .room-title .live-badge {
            font-size: 10px;
            background: #EC4899;
            color: #fff;
            padding: 2px 10px;
            border-radius: 60px;
            font-weight: 600;
            animation: pulse 1.8s infinite;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.96);
            }
        }
        .room-card .room-meta {

    <script>
        // ============================================================
        // توينز — Full App with WebRTC Voice Chat
        // ============================================================

        (function() {
            'use strict';

            // ==========================================================
            // 1. SUPABASE INIT
            // ==========================================================
            const supabaseUrl = 'https://swzfalqiqwoawjihcauu.supabase.co';
            const supabaseKey = 'sb_publishable_eN6V6meQzske2R5FK-0Qow_GV24R0uj';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // ==========================================================
            // 2. PARTICLES
            // ==========================================================
            (function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let w, h;
                let particles = [];
                const COUNT = 45;

                function resize() {
                    const rect = document.getElementById('app').getBoundingClientRect();
                    w = canvas.width = rect.width;
                    h = canvas.height = rect.height;
                }
                resize();
                window.addEventListener('resize', resize);

                class Particle {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.4;
                        this.speedY = (Math.random() - 0.5) * 0.4;
                        this.opacity = Math.random() * 0.4 + 0.1;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) { this.speedX *= -1;
                            this.x = Math.max(0, Math.min(w, this.x)); }
                        if (this.y < 0 || this.y > h) { this.speedY *= -1;
                            this.y = Math.max(0, Math.min(h, this.y)); }
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(139, 92, 246, ${this.opacity})`;
                        ctx.fill();
                    }
                }
                for (let i = 0; i < COUNT; i++) particles.push(new Particle());

                function drawLines() {
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                const alpha = (1 - dist / 120) * 0.15;
                                ctx.strokeStyle = `rgba(139, 92, 246, ${alpha})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                }

                function loop() {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => { p.update();
                        p.draw(); });
                    drawLines();
                    requestAnimationFrame(loop);
                }
                loop();

                const ro = new ResizeObserver(() => resize());
                ro.observe(document.getElementById('app'));
            })();

            // ==========================================================
            // 3. STATE
            // ==========================================================
            let state = {
                currentUser: null,
                users: [],
                rooms: [],
                chats: {},
                notifications: [],
                isLoggedIn: false,
                activeTab: 'active',
                currentRoomId: null,
                chatPartnerId: null,
                music: { playing: false, progress: 0, volume: 0.7, isLocal: false, currentTrack: null },
                voice: {
                    enabled: false,
                    muted: false,
                    stream: null,
                    context: null,
                    analyser: null,
                    source: null,
                    isSpeaking: false,
                    mySeatIndex: -1,
                    peers: {}, // userId -> RTCPeerConnection
                    channels: {} // userId -> supabase channel for signaling
                }
            };

            let musicInterval = null;
            let audioElement = null;
            let typingTimeout = null;
            let replyTimeout = null;
            let voiceLevelInterval = null;

            // ==========================================================
            // 4. LOCALSTORAGE
            // ==========================================================
            function loadState() {
                try {
                    const saved = localStorage.getItem('twinz_state_v9');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        state = { ...state, ...parsed };
                        return true;
                    }
                } catch (e) { /* ignore */ }
                return false;
            }

            function saveState() {
                try {
                    const toSave = { ...state };
                    if (toSave.music && toSave.music.audio) toSave.music.audio = null;
                    if (toSave.voice) {
                        toSave.voice.stream = null;
                        toSave.voice.context = null;
                        toSave.voice.analyser = null;
                        toSave.voice.source = null;
                        toSave.voice.peers = {};
                        toSave.voice.channels = {};
                    }
                    localStorage.setItem('twinz_state_v9', JSON.stringify(toSave));
                } catch (e) { /* ignore */ }
            }

            // ==========================================================
            // 5. SCREENS
            // ==========================================================
            const screens = {};
            let currentScreen = 'splash';

            function initScreens() {
                document.querySelectorAll('.screen').forEach(el => { screens[el.id] = el; });
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens.splash.classList.add('active');
                currentScreen = 'splash';
                updateNavVisibility();
            }

            function navigateTo(screenId, extraData) {
                if (!screens[screenId]) return;
                if (screenId === 'chatDetail' && extraData) {
                    state.chatPartnerId = extraData;
                    openChatDetail(extraData);
                    return;
                }
                Object.values(screens).forEach(s => s.classList.remove('active'));
                screens[screenId].classList.add('active');
                currentScreen = screenId;
                updateNavVisibility();
                screens[screenId].scrollTop = 0;
                renderScreen(screenId);
                updateNavActive(screenId);
                saveState();
            }

            function updateNavVisibility() {
                const nav = document.getElementById('bottomNav');
                const hidden = ['splash', 'chatDetail'];
                const chatDetailActive = document.getElementById('chatDetailOverlay').classList.contains('active');
                const roomDetailActive = document.getElementById('roomDetailPage').classList.contains('active');
                if (hidden.includes(currentScreen) || chatDetailActive || roomDetailActive) {
                    nav.style.display = 'none';
                } else {
                    nav.style.display = 'flex';
                }
            }

            function updateNavActive(screenId) {
                document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.screen === screenId);
                });
            }

            function renderScreen(screenId) {
                switch (screenId) {
                    case 'mainScreen':
                        renderMainFeed();
                        break;
                    case 'roomsScreen':
                        renderRooms();
                        break;
                    case 'chatScreen':
                        renderChatList();
                        break;
                    case 'profileScreen':
                        renderProfile();
                        break;
                }
            }

            // ==========================================================
            // 6. AUTH UI (unchanged)
            // ==========================================================
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginError = document.getElementById('loginError');
            const signupError = document.getElementById('signupError');
            const loginSuccess = document.getElementById('loginSuccess');
            const signupSuccess = document.getElementById('signupSuccess');

            document.querySelectorAll('.toggle-password').forEach(btn => {
                btn.addEventListener('click', function() {
                    const target = document.getElementById(this.dataset.target);
                    if (target.type === 'password') {
                        target.type = 'text';
                        this.innerHTML = '<i class="fas fa-eye-slash"></i>';
                    } else {
                        target.type = 'password';
                        this.innerHTML = '<i class="fas fa-eye"></i>';
                    }
                });
            });

            document.querySelectorAll('.auth-tabs .tab-btn').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.auth-tabs .tab-btn').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    if (target === 'login') {
                        loginForm.classList.add('active');
                        signupForm.classList.remove('active');
                        loginError.classList.remove('show');
                        loginSuccess.classList.remove('show');
                    } else {
                        signupForm.classList.add('active');
                        loginForm.classList.remove('active');
                        signupError.classList.remove('show');
                        signupSuccess.classList.remove('show');
                    }
                });
            });

            document.getElementById('switchToSignup').addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector('.auth-tabs .tab-btn[data-tab="signup"]').click();
            });
            document.getElementById('switchToLogin').addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector('.auth-tabs .tab-btn[data-tab="login"]').click();
            });

            // ==========================================================
            // 7. AUTH ACTIONS + auto-create room
            // ==========================================================
            document.getElementById('loginBtn').addEventListener('click', async function() {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                loginError.classList.remove('show');
                loginSuccess.classList.remove('show');
                if (!email || !password) {
                    loginError.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
                    loginError.classList.add('show');
                    return;
                }
                this.classList.add('loading');
                this.disabled = true;
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        loginError.textContent = error.message === 'Invalid login credentials' ?
                            'البريد الإلكتروني أو كلمة المرور غير صحيحة' :
                            error.message;
                        loginError.classList.add('show');
                        this.classList.remove('loading');
                        this.disabled = false;
                        return;
                    }
                    if (data.user) {
                        const { data: profile, error: profileError } = await supabase
                            .from('profiles')
                            .select('*')
                            .eq('id', data.user.id)

            document.getElementById('signupBtn').addEventListener('click', async function() {
                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value.trim();
                const confirm = document.getElementById('signupConfirm').value.trim();
                signupError.classList.remove('show');
                signupSuccess.classList.remove('show');
                if (!name || !email || !password || !confirm) {
                    signupError.textContent = 'يرجى ملء جميع الحقول';
                    signupError.classList.add('show');
                    return;
                }
                if (password.length < 6) {
                    signupError.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                    signupError.classList.add('show');
                    return;
                }
                if (password !== confirm) {
                    signupError.textContent = 'كلمة المرور غير متطابقة مع التأكيد';
                    signupError.classList.add('show');
                    return;
                }
                this.classList.add('loading');
                this.disabled = true;
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: { data: { full_name: name } }
                    });
                    if (error) {
                        signupError.textContent = error.message;
                        signupError.classList.add('show');
                        this.classList.remove('loading');
                        this.disabled = false;
                        return;
                    }
                    if (data.user) {
                        const newProfile = {
                            id: data.user.id,
                            full_name: name,
                            username: 'user_' + data.user.id.slice(0, 8),
                            avatar_url: 'https://i.pravatar.cc/400?img=' + (Math.floor(Math.random() * 70) + 1),
                            bio: 'مرحباً! أنا في توينز',
                            interests: ['المغامرات', 'السفر', 'الخيال', 'القراءة'],
                            location: 'الرياض',
                            age: 25
                        };
                        const { error: insertError } = await supabase
                            .from('profiles')
                            .insert(newProfile);
                        if (insertError) { console.error('Insert error:', insertError); }
                        if (data.user.identities && data.user.identities.length === 0) {
                            signupSuccess.textContent = 'تم إنشاء الحساب! يرجى تأكيد بريدك الإلكتروني.';
                            signupSuccess.classList.add('show');
                        } else {
                            state.currentUser = newProfile;
                            state.isLoggedIn = true;
                            state.users = await fetchProfiles();
                            state.rooms = await fetchRooms();
                            if (state.rooms.length === 0) {
                                await createDefaultRoom(state.currentUser.id);
                                state.rooms = await fetchRooms();
                            }
                            saveState();
                            showToast('تم إنشاء الحساب بنجاح! 🎉', 'success');
                            navigateTo('mainScreen');
                            renderMainFeed();
                        }
                    }
                } catch (err) {
                    signupError.textContent = 'حدث خطأ: ' + err.message;
                    signupError.classList.add('show');
                } finally {
                    this.classList.remove('loading');
                    this.disabled = false;
                }
            });

            // ==========================================================
            // 8. SUPABASE HELPERS
            // ==========================================================
            async function fetchProfiles() {
                const { data, error } = await supabase.from('profiles').select('*');
                if (error) { console.error('Error fetching profiles:', error); return []; }
                return data;
            }

            async function fetchRooms() {
                const { data, error } = await supabase.from('rooms').select('*');
                if (error) { console.error('Error fetching rooms:', error); return []; }
                return data;
            }

            async function fetchRoomOccupants(roomId) {
                const { data, error } = await supabase.from('room_occupants').select('*').eq('room_id', roomId);
                if (error) { console.error('Error fetching occupants:', error); return []; }
                return data;
            }

            async function fetchRoomMessages(roomId) {
                const { data, error } = await supabase.from('room_messages')
                    .select('*, profiles(full_name, avatar_url)')
                    .eq('room_id', roomId)
                    .order('created_at', { ascending: true })
                    .limit(30);
                if (error) { console.error('Error fetching room messages:', error); return []; }
                return data;
            }

            async function fetchPrivateChats(userId) {
                const { data, error } = await supabase.from('private_chats')
                    .select('*')
                    .or(`user1_id.eq.${userId},user2_id.eq.${userId}`);
                if (error) { console.error('Error fetching private chats:', error); return []; }
                return data;
            }

            async function fetchPrivateMessages(chatId) {
                const { data, error } = await supabase.from('private_messages')
                    .select('*')
                    .eq('chat_id', chatId)
                    .order('created_at', { ascending: true });
                if (error) { console.error('Error fetching private messages:', error); return []; }
                return data;
            }

            async function fetchNotifications(userId) {
                const { data, error } = await supabase.from('notifications')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });
                if (error) { console.error('Error fetching notifications:', error); return []; }
                return data;
            }

            async function getOrCreatePrivateChat(user1Id, user2Id) {
                const { data: existing, error: findError } = await supabase
                    .from('private_chats')
                    .select('id')
                    .or(`user1_id.eq.${user1Id},user2_id.eq.${user1Id}`)
                    .or(`user1_id.eq.${user2Id},user2_id.eq.${user2Id}`)
                    .maybeSingle();
                if (findError && findError.code !== 'PGRST116') {
                    console.error('Error finding chat:', findError);
                }
                if (existing) return existing.id;
                const { data: newChat, error: createError } = await supabase
                    .from('private_chats')
                    .insert({ user1_id: user1Id, user2_id: user2Id })
                    .select('id')
                    .single();
                if (createError) { console.error('Error creating chat:', createError); return null; }
                return newChat.id;
            }

            async function sendPrivateMessage(chatId, senderId, content) {
                const { data, error } = await supabase
                    .from('private_messages')
                    .insert({ chat_id: chatId, sender_id: senderId, content, status: 'sent' })
                    .select()
                    .single();
                if (error) { console.error('Error sending message:', error); return null; }
                return data;
            }

            async function updateMessageStatus(messageId, status) {
                const { error } = await supabase
                    .from('private_messages')
                    .update({ status, read_at: status === 'read' ? new Date().toISOString() : null })
                    .eq('id', messageId);
                if (error) console.error('Error updating message status:', error);
            }

            async function renderRooms() {
                const rooms = await fetchRooms();
                state.rooms = rooms;
                for (const room of state.rooms) {
                    const occupants = await fetchRoomOccupants(room.id);
                    room.occupants = occupants.map(o => o.profile_id);
                    const messages = await fetchRoomMessages(room.id);
                    room.messages = messages.map(m => ({ from: m.profiles?.full_name || 'مستخدم', text: m.content,
                        time: new Date(m.created_at).toLocaleTimeString() }));
                }
                const container = document.getElementById('roomsList');
                if (state.rooms.length === 0) {
                    container.innerHTML =
                        `<div style="text-align:center;padding:40px 20px;color:var(--text-secondary);"><i class="fas fa-microphone-slash" style="font-size:40px;color:var(--text-light);display:block;margin-bottom:12px;"></i><h4>لا توجد غرف صوتية</h4><p>أنشئ أول غرفة الآن!</p></div>`;
                    return;
                }
                container.innerHTML = state.rooms.map(room => {
                    const occ = room.occupants ? room.occupants.length : 0;
                    const bgPreview = room.bg_url || 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=600';
                    return `

                                <div class="room-meta"><i class="fas fa-user-cog"></i> ${room.host_id ? 'المضيف' : 'غرفة عامة'}</div>
                                <div class="seats-grid">
                                    ${Array.from({ length: 8 }, (_, i) => {
                                        const occupantId = room.occupants && room.occupants[i] ? room.occupants[i] : null;
                                        const user = state.users.find(u => u.id === occupantId);
                                        if (occupantId) {
                                            let micClass = 'mic-icon';
                                            if (user && user.id === state.currentUser?.id) {
                                                micClass += ' my-mic';
                                            }
                                            return `<div class="seat" data-seat="${i}" data-room="${room.id}"><div class="seat-avatar" style="background-image:url('${user ? user.avatar_url : 'https://i.pravatar.cc/100?img=' + (i+5)}')"></div><div class="seat-name">${user ? user.full_name : 'مستخدم'}</div><div class="${micClass}"><i class="fas fa-microphone"></i></div></div>`;
                                        } else {
                                            return `<div class="seat empty" data-seat="${i}" data-room="${room.id}"><span class="plus-icon"><i class="fas fa-plus"></i></span></div>`;
                                        }
                                    }).join('')}
                                </div>
                                <div class="room-footer">
                                    <span class="room-occupants"><i class="fas fa-users"></i> ${occ}/8</span>
                                    <button class="enter-btn" data-room="${room.id}">دخول <i class="fas fa-arrow-left"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.room-card').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.seat') || e.target.closest('.enter-btn')) return;
                        const id = this.dataset.room;
                        openRoomDetailPage(id);
                    });
                });
                container.querySelectorAll('.enter-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.room;
                        openRoomDetailPage(id);
                    });
                });
                container.querySelectorAll('.seat').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const roomId = this.dataset.room;
                        const seatIdx = parseInt(this.dataset.seat);
                        const room = state.rooms.find(r => r.id == roomId);
                        if (!room) return;
                        if (!state.currentUser) { showToast('يرجى تسجيل الدخول أولاً', 'error'); return; }
                        const occupantId = room.occupants && room.occupants[seatIdx];
                        if (occupantId) {
                            if (occupantId === state.currentUser.id) {
                                supabase.from('room_occupants').delete()
                                    .eq('room_id', roomId).eq('profile_id', state.currentUser.id)
                                    .then(() => { showToast('غادرت المقعد', '');
                                        renderRooms(); });
                            } else {
                                showToast('هذا المقعد مشغول', 'error');
                            }
                        } else {
                            supabase.from('room_occupants').insert({
                                room_id: roomId,
                                profile_id: state.currentUser.id,
                                seat_index: seatIdx
                            }).then(() => { showToast('انضممت إلى المقعد 🎤', 'success');
                                renderRooms(); });
                        }
                    });
                });
                updateBadges();
            }

            let voiceInitialized = false;

            async function openRoomDetailPage(roomId) {
                const room = state.rooms.find(r => r.id == roomId);
                if (!room) return;
                state.currentRoomId = roomId;
                const page = document.getElementById('roomDetailPage');
                const bg = room.bg_url || 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=600';
                document.getElementById('rdBg').style.backgroundImage = `url('${bg}')`;
                document.getElementById('rdPageTitle').textContent = room.name;
                document.getElementById('rdPageHost').textContent = room.host_id ? 'المضيف' : 'غرفة عامة';
                const occCount = room.occupants ? room.occupants.length : 0;
                document.getElementById('rdPageOccupants').textContent = `${occCount}/8 متصلون`;

                // Find my seat
                let mySeatIndex = -1;
                if (state.currentUser && room.occupants) {
                    mySeatIndex = room.occupants.indexOf(state.currentUser.id);
                }
                state.voice.mySeatIndex = mySeatIndex;

                // Render seats
                const seatsContainer = document.getElementById('rdPageSeats');
                seatsContainer.innerHTML = Array.from({ length: 8 }, (_, i) => {
                    const occupantId = room.occupants && room.occupants[i] ? room.occupants[i] : null;
                    const user = state.users.find(u => u.id === occupantId);
                    const isMySeat = (i === mySeatIndex);
                    let seatClass = 'rd-seat';
                    if (isMySeat) seatClass += ' my-seat';
                    if (!occupantId) seatClass += ' empty';

                    let micHtml = '';

                    try { webrtcPeers[uid].close(); } catch (e) {}
                }
                webrtcPeers = {};
                // Unsubscribe from signaling channels
                for (const uid in state.voice.channels) {
