<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>توينز - تواصل وصداقة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js">
    </script>
    <style>
        /* ============================================================
           جميع الأنماط الأصلية (نفسها تماماً)
           ============================================================ */
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --gradient: linear-gradient(135deg, #6C3CE1 0%, #8B5CF6 40%, #EC4899 100%);
            --bg: #0F0A1A;
            --bg-card: rgba(255, 255, 255, 0.06);
            --text: #F1F0F7;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-light: rgba(255, 255, 255, 0.35);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --nav-height: 68px;
            --header-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            font-family: var(--font);
            background: #0F0A1A;
            color: var(--text);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        #app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width:768px) {
            #app {
                border-radius: 36px;
                height: 92vh;
                margin-top: 4vh;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            }
        }
        #particles-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--bg);
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: var(--nav-height);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(16px) scale(0.98);
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }
        .screen.no-nav {
            padding-bottom: 0;
        }

        /* ============================================================
           AUTH
           ============================================================ */
        #splash {
            background: var(--bg);
            justify-content: center;
            align-items: center;
            padding: 30px 24px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        #splash .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.5;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        #splash .bg-orb:nth-child(1) {
            width: 350px;
            height: 350px;
            top: -120px;
            right: -120px;
            background: var(--primary);
        }
        #splash .bg-orb:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            left: -80px;
            background: #EC4899;
            animation-delay: -4s;
        }
        #splash .bg-orb:nth-child(3) {
            width: 180px;
            height: 180px;
            top: 40%;
            left: -60px;
            background: #F59E0B;
            animation-delay: -8s;
            opacity: 0.3;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -20px) scale(1.05);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
            100% {
                transform: translate(10px, -10px) scale(1.02);
            }
        }
        #splash .logo {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.9s ease forwards;
            margin-bottom: 12px;
        }
        #splash .logo .logo-icon {
            display: inline-block;
            background: var(--gradient);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 36px;
            margin-bottom: 8px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.3);
        }
        #splash .logo .logo-text {
            display: block;
            font-size: 38px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #splash .logo .logo-sub {
            display: block;
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.5;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 4px;
            margin: 16px auto 20px;
            max-width: 320px;
            width: 100%;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .auth-tabs .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .auth-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .auth-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .auth-form {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.6s ease both;
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .auth-form .form-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .auth-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-align: right;
        }
        .auth-form .form-group .input-wrap {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 2px 18px 2px 4px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            direction: rtl;
        }
        .auth-form .form-group .input-wrap:focus-within {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.08);
        }
        .auth-form .form-group .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 8px 14px 0;
            font-size: 16px;
            color: #fff;
            outline: none;
            font-weight: 500;
            min-width: 0;
            direction: rtl;
        }
        .auth-form .form-group .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
        }
        .auth-form .form-group .input-wrap .input-icon {
            color: var(--text-light);
            font-size: 16px;
            padding: 0 4px;
            min-width: 32px;
            text-align: center;
        }
        .auth-form .form-group .input-wrap .toggle-password {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 8px;
            transition: var(--transition);
            border-radius: 50%;
        }
        .auth-form .form-group .input-wrap .toggle-password:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .auth-form .auth-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .auth-form .auth-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        .auth-form .auth-btn:hover::after {
            opacity: 1;
        }
        .auth-form .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(108, 60, 225, 0.4);
        }
        .auth-form .auth-btn:active {
            transform: scale(0.96);
        }
        .auth-form .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .auth-form .auth-btn .btn-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .auth-form .auth-btn.loading .btn-text {
            display: none;
        }
        .auth-form .auth-btn.loading .btn-spinner {
            display: block;
        }
        .auth-form .auth-links {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }
        .auth-form .auth-links a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
        }
        .auth-form .auth-links a:hover {
            color: #fff;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #F87171;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-error.show {
            display: block;
        }
        .auth-success {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #34D399;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-success.show {
            display: block;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            color: var(--text-light);
            font-size: 12px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ============================================================
           شارة التوثيق
           ============================================================ */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
            margin-right: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            line-height: 1;
            vertical-align: middle;
            animation: verifiedPulse 2.5s ease-in-out infinite;
        }
        .verified-badge-sm {
            width: 14px;
            height: 14px;
            font-size: 8px;
        }
        @keyframes verifiedPulse {
            0%,
            100% {
                box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
            }
            50% {
                box-shadow: 0 2px 16px rgba(124, 58, 237, 0.7);
            }
        }
        .verified-name {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           TOP HEADER (مع زر لوحة التحكم)
           ============================================================ */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 10px;
            background: rgba(15, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            min-height: var(--header-height);
        }
        .top-header .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .app-title i {
            font-size: 18px;
            -webkit-text-fill-color: initial;
            color: var(--primary-light);
        }
        .top-header .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .top-header .header-actions .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 17px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(8px);
        }
        .top-header .header-actions .icon-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            color: #fff;
            border-color: rgba(139, 92, 246, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .icon-btn:active {
            transform: scale(0.92);
        }
        .top-header .header-actions .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #EC4899;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 60px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.4);
        }
        .top-header .header-actions .admin-btn {
            background: rgba(124, 58, 237, 0.2);
            border-color: var(--primary);
            color: var(--primary-light);
        }
        .top-header .header-actions .admin-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        /* ============================================================
           MAIN FEED
           ============================================================ */
        .main-feed {
            flex: 1;
            padding: 0 16px 16px;
            overflow-y: auto;
        }
        .feed-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 4px;
            margin: 12px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feed-tabs .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .feed-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .feed-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .feed-content {
            display: block;
        }
        .feed-content.hidden {
            display: none;
        }

        .person-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
        }
        .person-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .person-card:active {
            transform: scale(0.98);
        }
        .person-card .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a1f3d;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .person-card .avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #34D399;
            border: 2px solid var(--bg);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }
        .person-card .avatar .online-dot.offline {
            background: #4B5563;
            box-shadow: none;
        }
        .person-card .info {
            flex: 1;
            min-width: 0;
        }
        .person-card .info .name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .person-card .info .sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .person-card .info .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .person-card .info .interests .tag {
            font-size: 9px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 60px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .person-card .action-btn-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--gradient);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.2);
        }
        .person-card .action-btn-sm:hover {
            transform: scale(1.1);
        }
        .person-card .action-btn-sm:active {
            transform: scale(0.90);
        }
        .follow-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.2);
            white-space: nowrap;
        }
        .follow-btn:hover {
            transform: scale(1.05);
        }
        .follow-btn:active {
            transform: scale(0.94);
        }
        .follow-btn.following {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }
        .follow-btn.following:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .soul-match-card {
            background: var(--gradient);
            border-radius: var(--radius);
            padding: 24px;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.25);
            position: relative;
            overflow: hidden;
        }
        .soul-match-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            pointer-events: none;
        }
        .soul-match-card h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
        }
        .soul-match-card p {
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 12px;
            position: relative;
        }
        .soul-match-card .match-percent {
            font-size: 40px;
            font-weight: 800;
            position: relative;
        }
        .soul-match-card .match-sub {
            opacity: 0.7;
            font-size: 13px;
            position: relative;
        }

        /* ============================================================
           VOICE ROOMS
           ============================================================ */
        .voice-rooms {
            flex: 1;
            padding: 12px 16px 16px;
            overflow-y: auto;
        }
        .voice-rooms .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .voice-rooms .room-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .voice-rooms .room-header .create-btn {
            background: var(--gradient);
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .voice-rooms .room-header .create-btn:hover {
            transform: translateY(-2px);

        .search-overlay .search-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .search-overlay .search-top .close-search {
            background: none;
            border: none;
            font-size: 26px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .search-overlay .search-top .close-search:hover {
            color: #fff;
        }
        .search-overlay .search-top input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .search-overlay .search-top input::placeholder {
            color: var(--text-light);
        }
        .search-overlay .search-top input:focus {
            border-color: rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.07);
        }
        .search-overlay .search-results {
            flex: 1;
            overflow-y: auto;
        }
        .search-overlay .search-results .result-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .search-overlay .search-results .result-item:hover {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 8px;
            border-radius: var(--radius-sm);
        }
        .search-overlay .search-results .result-item .ravatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a1f3d;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.04);
        }
        .search-overlay .search-results .result-item .rinfo {
            flex: 1;
        }
        .search-overlay .search-results .result-item .rinfo .rname {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .search-overlay .search-results .result-item .rinfo .rsub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .search-overlay .search-results .empty-search {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .search-overlay .search-results .empty-search i {
            font-size: 40px;
            color: var(--text-light);
            margin-bottom: 12px;
            display: block;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(15, 10, 26, 0.92);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px var(--safe-bottom);
            z-index: 50;
            box-shadow: 0 -4px 40px rgba(0, 0, 0, 0.3);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 8px;
            transition: var(--transition);
            position: relative;
            min-width: 48px;
        }
        .bottom-nav .nav-item i {
            font-size: 20px;
            transition: var(--transition);
        }
        .bottom-nav .nav-item.active {
            color: #fff;
        }
        .bottom-nav .nav-item.active i {
            transform: translateY(-2px);
            color: var(--primary-light);
        }
        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: #EC4899;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 60px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.3);
        }
        .bottom-nav .nav-item:active {
            transform: scale(0.92);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 14px;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
            pointer-events: auto;
            border-right: 3px solid var(--primary-light);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text);
        }
        .toast.success {
            border-right-color: #34D399;
        }
        .toast.error {
            border-right-color: #EF4444;
        }
        .toast i {
            font-size: 18px;
            color: var(--primary-light);
        }
        .toast.success i {
            color: #34D399;
        }
        .toast.error i {
            color: #EF4444;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) scale(0.94);
            }
        }

        .hidden {
            display: none !important;
        }
        @media (max-width:360px) {
            .room-card .seat {
                min-height: 44px;
            }
            .room-detail-page .rd-seats-grid .rd-seat {
                min-height: 56px;
            }
            .profile-avatar-wrapper .profile-avatar {
                width: 72px;
                height: 72px;
            }
            .profile-avatar-wrapper .profile-name-area .pname {
                font-size: 18px;
            }
        }
        @supports (padding:max(0px)) {
            .bottom-nav {
                padding-bottom: max(8px, var(--safe-bottom));
            }
        }
        .loading-shimmer {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: var(--radius-sm);
            height: 60px;
            margin-bottom: 10px;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .file-input-hidden {
            display: none;
        }
        .fav-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .fav-empty i {
            font-size: 40px;
            color: var(--text-light);
            display: block;
            margin-bottom: 12px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: modalSlide 0.35s ease;
        }
        @keyframes modalSlide {
            from {
                transform: translateY(30px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .modal-box .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .modal-box .modal-close {
            float: left;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-box .modal-close:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        .modal-box .form-group {
            margin-bottom: 16px;
        }
        .modal-box .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
            transition: var(--transition);
            direction: rtl;
        }
        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }
        .modal-box .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            margin-top: 6px;
        }
        .modal-box .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="particles-canvas"></canvas>
        <div class="toast-container" id="toastContainer"></div>

        <!-- ===== SPLASH ===== -->
        <div class="screen active no-nav" id="splash">

                </div>

            </div>

                <div class="auth-success" id="signupSuccess"></div>

                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>

                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="signupEmail" placeholder="example@email.com" dir="ltr" />
                    </div>
                </div>

        <!-- ===== MAIN FEED ===== -->

            // ==========================================================
            // ROOM ADMIN FUNCTIONS (مع التحقق الكامل)
            // ==========================================================
            window.roomKickUser = async function(userId) {
                if (!state.currentUser) return;
                const user = state.users.find(u => u.id === userId);
                if (user && user.block_kick) {
                    const reason = user.block_kick_reason || 'تم منع الطرد من قبل المشرف';
                    showToast(`🚫 لا يمكنك طرد هذا المستخدم. السبب: ${reason}`, 'error');
                    return;
                }
                if (!state.adminSettings.allow_kick) {
                    showToast(`🚫 ميزة الطرد معطلة من قبل المشرف`, 'error');
                    return;
                }
                if (!confirm('هل تريد طرد هذا المستخدم من الغرفة؟')) return;
                const room = state.rooms.find(r => r.id == state.currentRoomId);
                if (!room) return;
                const idx = room.occupants.indexOf(userId);
                if (idx >= 0) {
                    room.occupants[idx] = null;
                    await supabase.from('room_occupants').delete()
                        .eq('room_id', room.id).eq('profile_id', userId);
                    await supabase.from('profiles').update({ is_kicked: true }).eq('id', userId);
                    showToast('✅ تم طرد المستخدم', 'success');
                    renderRooms();
                    openRoomDetailPage(state.currentRoomId);
                } else {
                    showToast('المستخدم غير موجود في الغرفة', 'error');
                }
            };

            window.roomMuteUser = async function(userId) {
                if (!state.currentUser) return;
                const user = state.users.find(u => u.id === userId);
                if (user && user.block_mute) {
                    const reason = user.block_mute_reason || 'تم منع الكتم من قبل المشرف';
                    showToast(`🚫 لا يمكنك كتم هذا المستخدم. السبب: ${reason}`, 'error');
                    return;
                }
                if (!state.adminSettings.allow_mute) {
                    showToast(`🚫 ميزة الكتم معطلة من قبل المشرف`, 'error');
                    return;
                }
                const userObj = state.users.find(u => u.id === userId);
                if (!userObj) return;
                const newMuteState = !userObj.is_muted;
                const action = newMuteState ? 'كتم' : 'رفع الكتم عن';
                if (!confirm(`هل تريد ${action} هذا المستخدم؟`)) return;
                const { error } = await supabase
                    .from('profiles')
                    .update({ is_muted: newMuteState })
                    .eq('id', userId);
                if (error) { showToast('خطأ: ' + error.message, 'error'); return; }
                showToast(`✅ تم ${action} المستخدم`, 'success');
                userObj.is_muted = newMuteState;
                renderRooms();
                openRoomDetailPage(state.currentRoomId);
            };

            window.roomBanUser = async function(userId) {
                if (!state.currentUser) return;
                const user = state.users.find(u => u.id === userId);
                if (user && user.block_ban) {
                    const reason = user.block_ban_reason || 'تم منع الحظر من قبل المشرف';
                    showToast(`🚫 لا يمكنك حظر هذا المستخدم. السبب: ${reason}`, 'error');
                    return;
                }
                if (!state.adminSettings.allow_ban) {
                    showToast(`🚫 ميزة الحظر معطلة من قبل المشرف`, 'error');
                    return;
                }
                if (!confirm('⚠️ هل تريد حظر هذا المستخدم نهائياً من التطبيق؟')) return;
                const reason = prompt('سبب الحظر:');
                if (reason === null) return;
                const finalReason = reason.trim() || 'مخالفة قوانين الغرفة';
                const { error } = await supabase
                    .from('profiles')
                    .update({ is_banned: true, ban_reason: finalReason })
                    .eq('id', userId);
                if (error) { showToast('خطأ في الحظر: ' + error.message, 'error'); return; }
                try {
                    await supabase.from('bans').insert([{
                        user_id: userId,
                        admin_id: state.currentUser.id,
                        reason: finalReason,
                        message_for_user: `🚫 تم حظرك من قبل مشرف الغرفة. السبب: ${finalReason}`
                    }]);
                } catch (e) { console.log('Ban log error:', e); }
                const room = state.rooms.find(r => r.id == state.currentRoomId);
                if (room) {
                    const idx = room.occupants.indexOf(userId);
                    if (idx >= 0) {
                        room.occupants[idx] = null;
                        await supabase.from('room_occupants').delete()
                            .eq('room_id', room.id).eq('profile_id', userId);
                    }

                        'hidden');
                    state.activeTab = tab;

            document.getElementById('createRoomBtn').addEventListener('click', async function() {
                if (!state.currentUser) { showToast('يرجى تسجيل الدخول أولاً', 'error'); return; }
                const name = prompt('أدخل اسم الغرفة:');
                if (!name || name.trim() === '') return;
                const description = prompt('أدخل وصف الغرفة:') || '';
                const bgOptions = [
                    'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=600',
                    'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=600',
                    'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600',
                    'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600',
                    'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600'
                ];
                const randomBg = bgOptions[Math.floor(Math.random() * bgOptions.length)];
                const { data, error } = await supabase
                    .from('rooms')
                    .insert({
                        name: name.trim(),
                        host_id: state.currentUser.id,
                        bg_url: randomBg,
                        description: description
                    })
                    .select()
                    .single();
                if (error) { showToast('فشل إنشاء الغرفة', 'error');
                    console.error(error); return; }
                state.rooms.push(data);
                showToast('تم إنشاء الغرفة 🎉', 'success');
                renderRooms();
                setTimeout(() => openRoomDetailPage(data.id), 400);
            });

            function showToast(message, type = '') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast' + (type ? ' ' + type : '');
                const iconMap = { 'success': 'fa-check-circle', 'error': 'fa-exclamation-circle' };
                const icon = iconMap[type] || 'fa-info-circle';
                toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
            }

            async function updateBadges() {
                if (!state.currentUser) {
                    document.getElementById('notifBadge').style.display = 'none';
                    return;
                }
                try {
                    const { count, error } = await supabase
                        .from('notifications')
                        .select('*', { count: 'exact', head: true })
                        .eq('user_id', state.currentUser.id)
                        .eq('is_read', false);
                    if (!error) {
                        const notifBadge = document.getElementById('notifBadge');
                        if (count > 0) {
                            notifBadge.textContent = count > 9 ? '9+' : count;
                            notifBadge.style.display = 'block';
                        } else {
                            notifBadge.style.display = 'none';
                        }
                    }
                } catch (e) { /* ignore */ }
            }

                navigateTo('chatDetail', id); };

            window.roomKickUser = roomKickUser;
            window.roomMuteUser = roomMuteUser;
            window.roomBanUser = roomBanUser;

            // ==========================================================
            // INIT
            // ==========================================================
            async function init() {
                loadState();
                await loadAdminSettings();

                const { data: session } = await supabase.auth.getSession();
                if (session?.session?.user) {
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', session.session.user.id)
                        .maybeSingle();
                    if (profile) {
                        if (profile.is_banned) {
                            showToast(`🚫 حسابك محظور. السبب: ${profile.ban_reason || 'لا يوجد سبب'}`, 'error');
                            showBanModal(profile.ban_reason || 'لا يوجد سبب');
                        } else if (profile.is_kicked) {
                            showToast('🚪 تم طردك من التطبيق مؤقتاً.', 'error');
                            showKickModal();
                        } else {
                            state.currentUser = profile;
                            state.isLoggedIn = true;
                            await loadUserFavorites();
                            await loadFollowData();
                        }
                    }
                }

                initScreens();

                state.users = await fetchProfiles();
                state.rooms = await fetchRooms();

                if (state.isLoggedIn && state.currentUser) {
                    navigateTo('mainScreen');
                    renderMainFeed();
                } else {
                    navigateTo('splash');
                }

                updateBadges();
                setInterval(updateBadges, 30000);

                console.log('🚀 توينز — متصل بلوحة التحكم (جدول profiles)');
                console.log('📦 State:', state);
            }

            document.addEventListener('DOMContentLoaded', init);
            window.__twinz = { state, navigateTo, showToast, renderRooms, renderMainFeed, saveState, supabase };

        })();
