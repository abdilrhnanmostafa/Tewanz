<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>توينز - تواصل وصداقة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js">
    </script>
    <style>
        /* ============================================================
           CSS
           ============================================================ */
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B5CF6;
            --gradient: linear-gradient(135deg, #6C3CE1 0%, #8B5CF6 40%, #EC4899 100%);
            --bg: #0F0A1A;
            --bg-card: rgba(255, 255, 255, 0.06);
            --text: #F1F0F7;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-light: rgba(255, 255, 255, 0.35);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --nav-height: 68px;
            --header-height: 60px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            font-family: var(--font);
            background: #0F0A1A;
            color: var(--text);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        #app {
            max-width: 430px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        @media (min-width:768px) {
            #app {
                border-radius: 36px;
                height: 92vh;
                margin-top: 4vh;
                box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            }
        }
        #particles-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--bg);
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: var(--nav-height);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateY(16px) scale(0.98);
            pointer-events: none;
            z-index: 1;
            will-change: transform, opacity;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }
        .screen.no-nav {
            padding-bottom: 0;
        }

        /* ============================================================
           AUTH
           ============================================================ */
        #splash {
            background: var(--bg);
            justify-content: center;
            align-items: center;
            padding: 30px 24px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        #splash .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.5;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        #splash .bg-orb:nth-child(1) {
            width: 350px;
            height: 350px;
            top: -120px;
            right: -120px;
            background: var(--primary);
        }
        #splash .bg-orb:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            left: -80px;
            background: #EC4899;
            animation-delay: -4s;
        }
        #splash .bg-orb:nth-child(3) {
            width: 180px;
            height: 180px;
            top: 40%;
            left: -60px;
            background: #F59E0B;
            animation-delay: -8s;
            opacity: 0.3;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -20px) scale(1.05);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
            100% {
                transform: translate(10px, -10px) scale(1.02);
            }
        }
        #splash .logo {
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.9s ease forwards;
            margin-bottom: 12px;
        }
        #splash .logo .logo-icon {
            display: inline-block;
            background: var(--gradient);
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 36px;
            margin-bottom: 8px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.3);
        }
        #splash .logo .logo-text {
            display: block;
            font-size: 38px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #splash .logo .logo-sub {
            display: block;
            font-size: 13px;
            letter-spacing: 4px;
            opacity: 0.5;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 4px;
            margin: 16px auto 20px;
            max-width: 320px;
            width: 100%;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .auth-tabs .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .auth-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .auth-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .auth-form {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.6s ease both;
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .auth-form .form-group {
            margin-bottom: 16px;
            text-align: right;
        }
        .auth-form .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-align: right;
        }
        .auth-form .form-group .input-wrap {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 2px 18px 2px 4px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            direction: rtl;
        }
        .auth-form .form-group .input-wrap:focus-within {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.08);
        }
        .auth-form .form-group .input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 8px 14px 0;
            font-size: 16px;
            color: #fff;
            outline: none;
            font-weight: 500;
            min-width: 0;
            direction: rtl;
        }
        .auth-form .form-group .input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
        }
        .auth-form .form-group .input-wrap .input-icon {
            color: var(--text-light);
            font-size: 16px;
            padding: 0 4px;
            min-width: 32px;
            text-align: center;
        }
        .auth-form .form-group .input-wrap .toggle-password {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 8px;
            transition: var(--transition);
            border-radius: 50%;
        }
        .auth-form .form-group .input-wrap .toggle-password:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }
        .auth-form .auth-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: var(--gradient);
            color: #fff;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 24px rgba(108, 60, 225, 0.3);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .auth-form .auth-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        .auth-form .auth-btn:hover::after {
            opacity: 1;
        }
        .auth-form .auth-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 32px rgba(108, 60, 225, 0.4);
        }
        .auth-form .auth-btn:active {
            transform: scale(0.96);
        }
        .auth-form .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .auth-form .auth-btn .btn-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .auth-form .auth-btn.loading .btn-text {
            display: none;
        }
        .auth-form .auth-btn.loading .btn-spinner {
            display: block;
        }
        .auth-form .auth-links {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }
        .auth-form .auth-links a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
        }
        .auth-form .auth-links a:hover {
            color: #fff;
        }
        .auth-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #F87171;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-error.show {
            display: block;
        }
        .auth-success {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            color: #34D399;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
        .auth-success.show {
            display: block;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0;
            color: var(--text-light);
            font-size: 12px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ============================================================
           شارة التوثيق
           ============================================================ */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #8B5CF6, #6D28D9);
            border-radius: 50%;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
            margin-right: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            line-height: 1;
            vertical-align: middle;
            animation: verifiedPulse 2.5s ease-in-out infinite;
        }
        .verified-badge-sm {
            width: 14px;
            height: 14px;
            font-size: 8px;
        }
        @keyframes verifiedPulse {
            0%,
            100% {
                box-shadow: 0 2px 8px rgba(124, 58, 237, 0.45);
            }
            50% {
                box-shadow: 0 2px 16px rgba(124, 58, 237, 0.7);
            }
        }
        .verified-name {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           TOP HEADER
           ============================================================ */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 10px;
            background: rgba(15, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            min-height: var(--header-height);
        }
        .top-header .app-title {
            font-size: 20px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-header .app-title i {
            font-size: 18px;
            -webkit-text-fill-color: initial;
            color: var(--primary-light);
        }
        .top-header .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .top-header .header-actions .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 17px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            backdrop-filter: blur(8px);
        }
        .top-header .header-actions .icon-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            color: #fff;
            border-color: rgba(139, 92, 246, 0.2);
            transform: scale(1.05);
        }
        .top-header .header-actions .icon-btn:active {
            transform: scale(0.92);
        }
        .top-header .header-actions .icon-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #EC4899;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 60px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.4);
        }

        /* ============================================================
           MAIN FEED
           ============================================================ */
        .main-feed {
            flex: 1;
            padding: 0 16px 16px;
            overflow-y: auto;
        }
        .feed-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 4px;
            margin: 12px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .feed-tabs .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }
        .feed-tabs .tab-btn.active {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .feed-tabs .tab-btn:active {
            transform: scale(0.96);
        }
        .feed-content {
            display: block;
        }
        .feed-content.hidden {
            display: none;
        }

        .person-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
        }
        .person-card:hover {
            border-color: rgba(139, 92, 246, 0.2);
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .person-card:active {
            transform: scale(0.98);
        }
        .person-card .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a1f3d;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .person-card .avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #34D399;
            border: 2px solid var(--bg);
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }
        .person-card .avatar .online-dot.offline {
            background: #4B5563;
            box-shadow: none;
        }
        .person-card .info {
            flex: 1;
            min-width: 0;
        }
        .person-card .info .name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .person-card .info .sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .person-card .info .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .person-card .info .interests .tag {
            font-size: 9px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 60px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .person-card .action-btn-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--gradient);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.2);
        }
        .person-card .action-btn-sm:hover {
            transform: scale(1.1);
        }
        .person-card .action-btn-sm:active {
            transform: scale(0.90);
        }
        .follow-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 60, 225, 0.2);
            white-space: nowrap;
        }
        .follow-btn:hover {
            transform: scale(1.05);
        }
        .follow-btn:active {
            transform: scale(0.94);
        }
        .follow-btn.following {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }
        .follow-btn.following:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .soul-match-card {
            background: var(--gradient);
            border-radius: var(--radius);
            padding: 24px;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 8px 40px rgba(108, 60, 225, 0.25);
            position: relative;
            overflow: hidden;
        }
        .soul-match-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            pointer-events: none;
        }
        .soul-match-card h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            position: relative;
        }
        .soul-match-card p {
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 12px;
            position: relative;
        }
        .soul-match-card .match-percent {
            font-size: 40px;
            font-weight: 800;
            position: relative;
        }
        .soul-match-card .match-sub {
            opacity: 0.7;
            font-size: 13px;
            position: relative;
        }

        /* ============================================================
           VOICE ROOMS
           ============================================================ */
        .voice-rooms {
            flex: 1;
            padding: 12px 16px 16px;
            overflow-y: auto;
        }
        .voice-rooms .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .voice-rooms .room-header h2 {
            font-size: 20px;
            font-weight: 700;
        }
        .voice-rooms .room-header .create-btn {
            background: var(--gradient);
            border: none;
            padding: 10px 20px;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .voice-rooms .room-header .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(108, 60, 225, 0.3);
        }
        .voice-rooms .room-header .create-btn:active {
            transform: scale(0.96);
        }

        .room-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);

        }
        .search-overlay .search-top input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
        }
        .search-overlay .search-top input::placeholder {
            color: var(--text-light);
        }
        .search-overlay .search-top input:focus {
            border-color: rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.07);
        }
        .search-overlay .search-results {
            flex: 1;
            overflow-y: auto;
        }
        .search-overlay .search-results .result-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .search-overlay .search-results .result-item:hover {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 8px;
            border-radius: var(--radius-sm);
        }
        .search-overlay .search-results .result-item .ravatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a1f3d;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.04);
        }
        .search-overlay .search-results .result-item .rinfo {
            flex: 1;
        }
        .search-overlay .search-results .result-item .rinfo .rname {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .search-overlay .search-results .result-item .rinfo .rsub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .search-overlay .search-results .empty-search {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .search-overlay .search-results .empty-search i {
            font-size: 40px;
            color: var(--text-light);
            margin-bottom: 12px;
            display: block;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(15, 10, 26, 0.92);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px var(--safe-bottom);
            z-index: 50;
            box-shadow: 0 -4px 40px rgba(0, 0, 0, 0.3);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 8px;
            transition: var(--transition);
            position: relative;
            min-width: 48px;
        }
        .bottom-nav .nav-item i {
            font-size: 20px;
            transition: var(--transition);
        }
        .bottom-nav .nav-item.active {
            color: #fff;
        }
        .bottom-nav .nav-item.active i {
            transform: translateY(-2px);
            color: var(--primary-light);
        }
        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            background: #EC4899;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 60px;
            min-width: 18px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.3);
        }
        .bottom-nav .nav-item:active {
            transform: scale(0.92);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: absolute;
            top: 70px;
            left: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 14px;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
            pointer-events: auto;
            border-right: 3px solid var(--primary-light);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text);
        }
        .toast.success {
            border-right-color: #34D399;
        }
        .toast.error {
            border-right-color: #EF4444;
        }
        .toast i {
            font-size: 18px;
            color: var(--primary-light);
        }
        .toast.success i {
            color: #34D399;
        }
        .toast.error i {
            color: #EF4444;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.94);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px) scale(0.94);
            }
        }

        .hidden {
            display: none !important;
        }
        @media (max-width:360px) {
            .room-card .seat {
                min-height: 44px;
            }
            .room-detail-page .rd-seats-grid .rd-seat {
                min-height: 56px;
            }
            .profile-avatar-wrapper .profile-avatar {
                width: 72px;
                height: 72px;
            }
            .profile-avatar-wrapper .profile-name-area .pname {
                font-size: 18px;
            }
        }
        @supports (padding:max(0px)) {
            .bottom-nav {
                padding-bottom: max(8px, var(--safe-bottom));
            }
        }
        .loading-shimmer {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: var(--radius-sm);
            height: 60px;
            margin-bottom: 10px;
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .file-input-hidden {
            display: none;
        }
        .fav-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .fav-empty i {
            font-size: 40px;
            color: var(--text-light);
            display: block;
            margin-bottom: 12px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            animation: modalSlide 0.35s ease;
        }
        @keyframes modalSlide {
            from {
                transform: translateY(30px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .modal-box .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .modal-box .modal-close {
            float: left;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-box .modal-close:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        .modal-box .form-group {
            margin-bottom: 16px;
        }
        .modal-box .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            font-family: var(--font);
            transition: var(--transition);
            direction: rtl;
        }
        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }
        .modal-box .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            margin-top: 6px;
        }
        .modal-box .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="particles-canvas"></canvas>
        <div class="toast-container" id="toastContainer"></div>

        <!-- ===== SPLASH ===== -->
        <div class="screen active no-nav" id="splash">
            <div class="bg-orb"></div>
            <div class="bg-orb"></div>
            <div class="bg-orb"></div>
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-heart"></i> <i class="fas fa-heart"></i></div>
                <span class="logo-text">توينز</span>
                <span class="logo-sub">تواصل وصداقة</span>
            </div>
            <div class="auth-tabs" id="authTabs">
                <button class="tab-btn active" data-tab="login">تسجيل الدخول</button>
                <button class="tab-btn" data-tab="signup">إنشاء حساب</button>
            </div>
            <div class="auth-form active" id="loginForm">
                <div class="auth-error" id="loginError"></div>
                <div class="auth-success" id="loginSuccess"></div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="loginEmail" placeholder="example@email.com" dir="ltr" />
                    </div>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="loginPassword" placeholder="••••••••" dir="ltr" />
                        <button class="toggle-password" type="button" data-target="loginPassword"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button class="auth-btn" id="loginBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                    <span class="btn-spinner"></span>
                </button>
                <div class="auth-links"><a id="forgotPasswordLink">نسيت كلمة المرور؟</a></div>
                <div class="auth-divider">أو</div>
                <div class="auth-links">ليس لديك حساب؟ <a id="switchToSignup">إنشاء حساب جديد</a></div>
            </div>
            <div class="auth-form" id="signupForm">
                <div class="auth-error" id="signupError"></div>
                <div class="auth-success" id="signupSuccess"></div>
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="signupName" placeholder="أحمد المنصور" />
                    </div>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="signupEmail" placeholder="example@email.com" dir="ltr" />
                    </div>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="signupPassword" placeholder="•••••••• (6 أحرف على الأقل)" dir="ltr" />
                        <button class="toggle-password" type="button" data-target="signupPassword"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fas fa-check-circle"></i></span>
                        <input type="password" id="signupConfirm" placeholder="أعد كتابة كلمة المرور" dir="ltr" />
                        <button class="toggle-password" type="button" data-target="signupConfirm"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button class="auth-btn" id="signupBtn">
                    <span class="btn-text">إنشاء حساب</span>
                    <span class="btn-spinner"></span>
                </button>
                <div class="auth-links" style="margin-top:12px;">لديك حساب بالفعل؟ <a id="switchToLogin">تسجيل الدخول</a></div>
            </div>
        </div>

        <!-- ===== MAIN FEED ===== -->
        <div class="screen" id="mainScreen">
            <div class="top-header">
                <span class="app-title"><i class="fas fa-heart"></i> توينز</span>
                <div class="header-actions">
                    <button class="icon-btn" id="searchBtn"><i class="fas fa-search"></i></button>
                    <button class="icon-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="badge" id="notifBadge">0</span></button>
                </div>
            </div>
            <div class="main-feed">
                <div class="feed-tabs">
                    <button class="tab-btn active" data-tab="active">الناشطون</button>
                    <button class="tab-btn" data-tab="nearby">قريبون</button>
                    <button class="tab-btn" data-tab="soul">توافق</button>
                    <button class="tab-btn" data-tab="favorites">⭐ المفضلة</button>
                </div>
                <div class="feed-content" id="tabActive"><div id="activeFriendsList"><div class="loading-shimmer"></div><div class="loading-shimmer"></div></div></div>
                <div class="feed-content hidden" id="tabNearby"><div id="nearbyPeopleList"><div class="loading-shimmer"></div><div class="loading-shimmer"></div></div></div>
                <div class="feed-content hidden" id="tabSoul"><div id="soulMatchContent"><div class="loading-shimmer"></div></div></div>
                <div class="feed-content hidden" id="tabFavorites"><div id="favoritesList"><div class="loading-shimmer"></div><div class="loading-shimmer"></div></div></div>
            </div>
        </div>

        <!-- ===== VOICE ROOMS ===== -->
        <div class="screen" id="roomsScreen">
            <div class="top-header">
                <span class="app-title"><i class="fas fa-microphone-alt"></i> الغرف الصوتية</span>
                <div class="header-actions">
                    <button class="icon-btn" id="searchBtnRooms"><i class="fas fa-search"></i></button>
                    <button class="icon-btn" id="notifBtnRooms"><i class="fas fa-bell"></i></button>
                </div>
            </div>
            <div class="voice-rooms">
                <div class="room-header">
                    <h2>الغرف النشطة</h2>
                    <button class="create-btn" id="createRoomBtn"><i class="fas fa-plus"></i> غرفة جديدة</button>
                </div>
                <div id="roomsList"><div class="loading-shimmer"></div><div class="loading-shimmer"></div></div>
            </div>
        </div>

        <!-- ===== ROOM DETAIL ===== -->
        <div class="room-detail-page" id="roomDetailPage">
            <div class="rd-bg" id="rdBg"></div>
            <div class="rd-bg-overlay"></div>
            <div class="rd-header">
                <button class="rd-back" id="rdBack"><i class="fas fa-arrow-right"></i></button>
                <div class="rd-title" id="rdPageTitle">غرفة المرح</div>
                <span class="rd-live">● مباشر</span>
                <div class="rd-actions">
                    <button id="rdFavBtn" title="المفضلة"><i class="fas fa-heart"></i></button>
                    <button id="rdSettingsBtn" title="إعدادات الغرفة"><i class="fas fa-cog"></i></button>
                    <button id="rdLeaveBtn" title="مغادرة الغرفة"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="rd-body" id="rdBody">
                <div class="rd-info-row">
                    <span class="rd-host"><i class="fas fa-user-cog"></i> <span id="rdPageHost">ديانا</span></span>
                    <span class="rd-occupants-count" id="rdPageOccupants">0/8 متصلون</span>
                </div>
                <div class="rd-seats-grid" id="rdPageSeats"></div>
                <div class="rd-voice-control" id="voiceControl">
                    <div class="vc-status">
                        <span class="vc-dot" id="vcDot"></span>
                        <span class="vc-label" id="vcLabel">🔇 الميكروفون غير نشط</span>
                    </div>
                    <div class="vc-level" id="vcLevel">
                        <div class="vc-level-fill" id="vcLevelFill"></div>
                    </div>
                    <button class="vc-btn" id="vcToggleBtn"><i class="fas fa-microphone-slash"></i> تفعيل</button>
                    <button class="vc-btn" id="vcMuteBtn"><i class="fas fa-volume-up"></i> كتم</button>
                </div>
                <div class="rd-admin-tools" id="rdAdminTools" style="display:none;">
                    <div class="at-title"><i class="fas fa-shield-alt"></i> أدوات المشرف</div>
                    <div class="at-buttons" id="rdAdminButtons"></div>
                </div>
                <div class="rd-music-player" id="rdMusicPlayer">
                    <div class="mp-top">
                        <div class="mp-cover"><i class="fas fa-music"></i></div>
                        <div class="mp-info">
                            <div class="mp-title" id="mpTrackTitle">اختر أغنية من هاتفك</div>
                            <div class="mp-artist" id="mpTrackArtist">🔄 اضغط على زر الاختيار</div>
                        </div>
                        <div class="mp-controls">
                            <button id="mpPrevBtn"><i class="fas fa-step-backward"></i></button>
                            <button class="mp-play" id="mpPlayBtn"><i class="fas fa-play"></i></button>
                            <button id="mpNextBtn"><i class="fas fa-step-forward"></i></button>
                        </div>
                    </div>
                    <div class="mp-progress">
                        <span class="mp-time" id="mpCurrentTime">00:00</span>
                        <div class="mp-bar" id="mpProgressBar"><div class="mp-fill" id="mpProgressFill"></div><div class="mp-dot"></div></div>
                        <span class="mp-time" id="mpDuration">00:00</span>
                    </div>
                    <div class="mp-volume">
                        <span class="mp-vol-icon"><i class="fas fa-volume-up"></i></span>
                        <div class="mp-vol-bar" id="mpVolBar"><div class="mp-vol-fill" id="mpVolFill"></div></div>
                    </div>
                    <button class="mp-file-btn" id="mpFileBtn"><i class="fas fa-folder-open"></i> اختر من هاتفي</button>
                    <input type="file" class="mp-file-input" id="mpFileInput" accept="audio/*" />
                </div>
                <div class="rd-chat-section">
                    <div class="rd-chat-msgs" id="rdPageMessages"></div>
                    <div class="rd-chat-input">
                        <input type="text" id="rdPageInput" placeholder="رسالة في الغرفة..." />
                        <button id="rdPageSendBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== CHAT LIST ===== -->
        <div class="screen" id="chatScreen">
            <div class="top-header">
                <span class="app-title"><i class="fas fa-comment-dots"></i> الشات</span>
                <div class="header-actions">
                    <button class="icon-btn" id="searchBtnChat"><i class="fas fa-search"></i></button>
                    <button class="icon-btn" id="notifBtnChat"><i class="fas fa-bell"></i></button>
                </div>
            </div>
            <div class="chat-list" id="chatListContainer"><div id="chatList"><div class="loading-shimmer"></div><div class="loading-shimmer"></div></div></div>
        </div>

        <!-- ===== PROFILE ===== -->
        <div class="screen" id="profileScreen">
            <div class="profile-main" id="profileMainContainer"></div>
        </div>

        <!-- ===== CHAT DETAIL ===== -->
        <div class="chat-detail-overlay" id="chatDetailOverlay">
            <div class="chat-detail-header">
                <button class="back-btn" id="chatDetailBack"><i class="fas fa-arrow-right"></i></button>
                <div class="avatar" id="cdAvatar" style="background-image:url('https://i.pravatar.cc/150?img=5')"></div>
                <div class="info">
                    <div class="name" id="cdName">ديانا</div>
                    <div class="status" id="cdStatus">متصل الآن</div>
                </div>
                <div class="call-actions">
                    <button class="call-btn" id="cdVideoCall"><i class="fas fa-video"></i></button>
                    <button class="call-btn" id="cdVoiceCall"><i class="fas fa-phone"></i></button>
                </div>
                <button class="chat-menu" id="chatMenuBtn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
            <div class="chat-msgs-area" id="cdMessages">
                <div id="typingIndicator" class="typing-indicator">
                    <span>يكتب</span>
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
            </div>
            <div class="chat-input-area">
                <div class="input-wrap">
                    <button class="chat-tool-btn" id="cdEmojiBtn"><i class="far fa-smile"></i></button>
                    <input type="text" id="cdInput" placeholder="اكتب رسالة..." />
                    <button class="chat-tool-btn" id="cdRecordBtn"><i class="fas fa-microphone"></i></button>
                    <button class="chat-tool-btn" id="cdFileBtn"><i class="fas fa-paperclip"></i></button>
                </div>
                <button class="send-chat-btn" id="cdSendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- ===== NOTIFICATIONS ===== -->
        <div class="notif-overlay" id="notifOverlay">
            <div class="notif-sheet">
                <div class="notif-header"><h3>الإشعارات</h3><button class="close-notif" id="notifClose"><i class="fas fa-times"></i></button></div>
                <div id="notifList"></div>
            </div>
        </div>

        <!-- ===== SEARCH ===== -->

        <div class="bottom-nav" id="bottomNav">

            <button class="nav-item" data-screen="roomsScreen"><i class="fas fa-microphone-alt"></i><span>الغرف</span></button>
            <button class="nav-item" data-screen="chatScreen"><i class="fas fa-comment-dots"></i><span>الشات</span></button>

        <input type="file" id="coverFileInput" class="file-input-hidden" accept="image/*" />

        <div class="modal-overlay" id="settingsModal">

                <div id="settingsModalContent"></div>
